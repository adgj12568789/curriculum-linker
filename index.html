<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>교과연계 기록</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.min.mjs" type="module"></script>
  <style>
    :root{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#1f2328;background:#f7f7f4;line-height:1.5}*{box-sizing:border-box}body{margin:0;background:#f7f7f4}button,input,select,textarea{font:inherit}.app{min-height:100vh}.topbar{height:74px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;border-bottom:1px solid #e7e7e2;background:rgba(247,247,244,.92);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.brand{display:flex;gap:11px;align-items:center}.brand-dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#222;color:white;font-weight:900}.brand-title{font-size:16px;font-weight:800}.brand-sub{font-size:12px;color:#7b8086}.saved-pill{padding:7px 11px;border-radius:999px;background:#eeefe8;color:#48504d;font-size:12px;font-weight:700;display:flex;gap:7px;align-items:center}.status-dot{width:7px;height:7px;border-radius:99px;background:#55a56e}.main-tabs{padding:14px 28px 0;display:flex;gap:6px;border-bottom:1px solid #e7e7e2;background:#f7f7f4;overflow:auto}.tab{border:0;background:transparent;padding:11px 14px 13px;border-radius:13px 13px 0 0;color:#777d83;font-weight:700;display:flex;gap:7px;align-items:center;cursor:pointer;white-space:nowrap}.tab.active{color:#1f2328;background:#fff;border:1px solid #e1e1dc;border-bottom-color:#fff;margin-bottom:-1px}.content{max-width:1180px;margin:0 auto;padding:24px 24px 90px}.notice{position:sticky;top:88px;z-index:8;width:max-content;max-width:100%;padding:10px 14px;border-radius:14px;background:#222;color:#fff;font-size:13px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.12)}.hero-card{padding:28px;border:1px solid #e4e4df;background:linear-gradient(135deg,#fff,#f1f1ea);border-radius:24px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:900;color:#7b817f;margin-bottom:8px}.hero-card h1{font-size:31px;line-height:1.22;margin:0 0 11px;letter-spacing:-.04em}.hero-card p,.section-head p{margin:0;color:#71777e;font-size:14px}.hero-badge{min-width:145px;padding:16px;border-radius:19px;background:#242825;color:#fff;font-size:12px}.hero-badge b{font-size:13px}.grid.two{display:grid;grid-template-columns:1.03fr .97fr;gap:16px}.stack{display:flex;flex-direction:column;gap:16px}.panel{background:#fff;border:1px solid #e2e2dd;border-radius:22px;padding:22px}.form-panel{display:flex;flex-direction:column;gap:16px}.panel-title{font-size:15px;font-weight:850;display:flex;gap:7px;align-items:center}.panel-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#6e7479;font-weight:700}.round-input,.round-textarea{width:100%;border:1px solid #dedfd9;border-radius:15px;background:#fafaf8;padding:12px 13px;color:#202328;outline:none}.round-input:focus,.round-textarea:focus{border-color:#929894;box-shadow:0 0 0 3px rgba(60,65,63,.06)}.round-textarea{min-height:105px;resize:vertical}.locked{height:44px;border:1px dashed #d5d7d0;border-radius:15px;background:#f8f8f4;padding:12px 13px;color:#50565b;display:flex;align-items:center}.activity-match-box{padding:14px;border-radius:17px;background:#f4f4ef}.mini-label{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.07em;color:#7f8580;margin-bottom:7px}.activity-chip{border:1px solid #d8d9d2;border-radius:999px;background:#fff;padding:9px 12px;margin:4px 4px 0 0;color:#464b4f;cursor:pointer}.activity-chip.selected{border-color:#262b28;background:#262b28;color:#fff}.muted-text{font-size:12px;color:#8b8f93}.primary,.soft,.icon{border:0;cursor:pointer;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800}.primary{padding:12px 16px;background:#212621;color:#fff}.primary:disabled{opacity:.55;cursor:not-allowed}.soft{padding:10px 13px;background:#efefe9;color:#4b514e}.soft.danger{color:#98423d;background:#f7ecea}.plan-preview{min-height:100%}.tiny-pill,.time-pill,.output-meta span,.record-card-top span{width:max-content;background:#efefe9;color:#575d5a;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.result-mini{display:flex;flex-direction:column;gap:11px}.match-code{font-weight:900;font-size:20px;letter-spacing:-.02em}.match-standard{font-size:14px;font-weight:700;line-height:1.55}.match-content{font-size:13px;color:#747a7d;padding:12px;border-radius:15px;background:#f6f6f2}.empty{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#8a8f93}.empty h3{margin:12px 0 5px;color:#3d4347}.empty p{margin:0;max-width:340px;font-size:13px}.output-panel{border:1px solid #cfd4ce;background:#fbfcf9}.output-meta{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.output-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.quote-box,.big-output{padding:14px 15px;border-radius:17px;background:#f2f3ee;border:1px solid #e3e5df;font-size:13px}.big-output{font-size:16px;line-height:1.7;background:#fff}.section-head{padding:10px 2px 5px}.section-head h2{margin:0 0 8px;font-size:25px;letter-spacing:-.03em}.upload-panel{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.upload-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:17px;background:#efefe9}.upload-panel h3{margin:0 0 3px;font-size:15px}.upload-panel p{margin:0;font-size:12px;color:#80858a}.upload-panel .primary{margin-left:auto}.actions{display:flex;gap:9px;margin-top:11px}.bulk{min-height:190px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.activity-tabs,.record-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.activity-tab,.record-tab{border:1px solid #dedfd9;background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap;cursor:pointer;color:#5a605f;font-weight:800}.activity-tab.active,.record-tab.active{background:#262b28;color:#fff;border-color:#262b28}.activity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.activity-card,.record-card{background:#fff;border:1px solid #e0e1dc;border-radius:20px;padding:17px}.activity-card-top{display:flex;justify-content:space-between;align-items:center}.icon{width:34px;height:34px;background:#f0f0eb;color:#666}.activity-title{font-size:15px;font-weight:850;margin:12px 0 7px}.activity-content{font-size:13px;color:#6e7479}.record-tabs .record-tab{border-radius:13px}.record-list{display:flex;flex-direction:column;gap:12px}.record-card h3{font-size:15px;margin:12px 0 6px}.record-card p{font-size:14px;line-height:1.65;margin:0 0 12px}.record-standard{padding:11px;border-radius:14px;background:#f7f7f3;color:#666d70;font-size:12px}.record-card-top{display:flex;gap:7px;flex-wrap:wrap}.plan-table{margin-top:13px;border:1px solid #e1e1dc;border-radius:16px;overflow:hidden}.plan-head,.plan-row{display:grid;grid-template-columns:100px 120px 1.3fr 1fr}.plan-head{background:#f1f1ec;font-size:11px;font-weight:900;color:#707670}.plan-head span,.plan-row span{padding:10px 11px;border-right:1px solid #e5e5e0}.plan-row{font-size:12px;color:#53595d;border-top:1px solid #eeeeea;background:#fff}.plan-head span:last-child,.plan-row span:last-child{border-right:0}.footer{text-align:center;color:#969b9e;font-size:11px;padding:26px}.hidden{display:none!important}@media(max-width:900px){.grid.two{grid-template-columns:1fr}.activity-grid{grid-template-columns:1fr 1fr}.hero-card{align-items:flex-start;flex-direction:column}.hero-card h1{font-size:26px}}@media(max-width:620px){.topbar{padding:0 16px}.main-tabs{padding-left:16px;padding-right:16px}.content{padding:18px 14px 80px}.field-grid,.output-columns,.activity-grid{grid-template-columns:1fr}.full{grid-column:auto}.upload-panel .primary{margin-left:0}.plan-head,.plan-row{grid-template-columns:70px 100px 1fr}.plan-head span:nth-child(4),.plan-row span:nth-child(4){display:none}.brand-sub{display:none}}
  </style>
</head>
<body>
<div id="app" class="app"></div>
<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.54/pdf.worker.min.mjs';

  const DB='curriculum-linker-v2', STORE='data';
  const state={tab:'link', plan:null, activities:[
    {id:'a1',day:'월',period:'1',grade:'1',subject:'사회',content:'자료를 읽고 핵심 개념을 정리하는 활동'},
    {id:'a2',day:'화',period:'2',grade:'1',subject:'사회',content:'모둠별로 자료를 비교하고 발표하는 활동'},
    {id:'a3',day:'수',period:'3',grade:'2',subject:'역사',content:'역사 자료를 조사하고 사건의 영향을 설명하는 활동'}
  ],records:[],link:{date:'2026-10-06',period:'1',grade:'1',subject:'사회',activity:''},result:null,notice:''};

  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const dayNames=['일','월','화','수','목','금','토'];
  const weekLabel=iso=>{const d=new Date(iso+'T00:00:00');if(Number.isNaN(d.getTime()))return '';const first=new Date(d.getFullYear(),d.getMonth(),1);const mondayIndex=(first.getDay()+6)%7;const week=Math.floor((d.getDate()+mondayIndex-1)/7)+1;return `${d.getMonth()+1}월 ${week}주차`;};
  const now=()=>new Date().toISOString();
  const dbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const dbGet=k=>dbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const dbSet=(k,v)=>dbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}));
  const dbDel=k=>dbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}));
  async function init(){const [p,a,r]=await Promise.all([dbGet('plan'),dbGet('activities'),dbGet('records')]);if(p)state.plan=p;if(a)state.activities=a;if(r)state.records=r;render();}
  const saveActivities=()=>dbSet('activities',state.activities);
  const saveRecords=()=>dbSet('records',state.records);
  const icons={spark:'✦',upload:'↑',book:'▣',clock:'◷',record:'☷',search:'⌕',trash:'×',plus:'＋'};

  function baseLayout(content){return `<header class="topbar"><div class="brand"><div class="brand-dot">${icons.spark}</div><div><div class="brand-title">교과연계 기록</div><div class="brand-sub">학년별 운영 계획을 읽고, 활동을 교과와 연결합니다.</div></div></div><div>${state.plan?`<span class="saved-pill"><span class="status-dot"></span> 계획서 저장됨</span>`:`<span class="saved-pill">계획서를 업로드해 주세요</span>`}</div></header><nav class="main-tabs">${tab('link','자동 연계','✦')}${tab('activities','활동 설정','◷')}${tab('records','활동 기록','☷')}${tab('plan','계획서','▣')}</nav><main class="content">${state.notice?`<div class="notice">${esc(state.notice)}</div>`:''}${content}</main><footer class="footer">중학교 1·2·3학년 지원 · 날짜로 주차 자동 판별 · 저장된 계획서는 이 브라우저에서 계속 유지됩니다.</footer>`}
  function tab(k,label,ic){return `<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${ic} ${label}</button>`}
  function render(){document.getElementById('app').innerHTML=baseLayout(page());document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.notice='';render()});wire();}
  function page(){if(state.tab==='activities')return activitiesPage();if(state.tab==='records')return recordsPage();if(state.tab==='plan')return planPage();return linkPage();}

  function linkPage(){
    const l=state.link,dow=l.date?dayNames[new Date(l.date+'T00:00:00').getDay()]:'',week=l.date?weekLabel(l.date):'';
    const matches=state.activities.filter(a=>a.day===dow&&a.period===l.period&&a.grade===l.grade&&a.subject===l.subject);
    const subjectOptions=[...new Set([...state.activities.map(a=>a.subject),...(state.plan?.rows||[]).map(r=>r.subject), '사회','역사','통합사회'].filter(Boolean))];
    return `<section class="stack"><div class="hero-card"><div><div class="eyebrow">자동 교과연계</div><h1>수업 날짜와 교시만 고르면<br>교과연계 기록이 만들어집니다.</h1><p>계획서의 해당 주차를 자동으로 찾아 성취기준 코드·성취기준·교과 내용을 활동과 연결합니다.</p></div><div class="hero-badge">${icons.spark}<br><b>Gemini 연계 AI 문구 생성</b></div></div><div class="grid two"><div class="panel form-panel"><div class="panel-title">수업 정보</div><div class="field-grid"><label class="field">날짜<input id="date" class="round-input" type="date" value="${esc(l.date)}"></label><label class="field">자동 판별 주차<div class="locked">${esc(week)}</div></label><label class="field">교시<select id="period" class="round-input">${[1,2,3,4,5,6,7].map(n=>`<option ${String(n)===l.period?'selected':''} value="${n}">${n}교시</option>`).join('')}</select></label><label class="field">학년<select id="grade" class="round-input">${[1,2,3].map(n=>`<option ${String(n)===l.grade?'selected':''} value="${n}">${n}학년</option>`).join('')}</select></label><label class="field">과목<select id="subject" class="round-input">${subjectOptions.map(s=>`<option ${s===l.subject?'selected':''}>${esc(s)}</option>`).join('')}</select></label></div><div class="activity-match-box"><div class="mini-label">이 교시에 등록된 활동</div>${matches.length?matches.map(a=>`<button class="activity-chip ${l.activity===a.content?'selected':''}" data-pick-activity="${esc(a.id)}">${esc(a.content)}</button>`).join(''):`<div class="muted-text">활동 설정에서 교시별 활동을 등록하거나 아래에 직접 입력하세요.</div>`}</div><label class="field">활동 내용<textarea id="activity" class="round-textarea" placeholder="예: 자료를 비교하여 공통점과 차이점을 정리하고 모둠 발표하기">${esc(l.activity)}</textarea></label><button id="generate" class="primary" ${state.plan?'':'disabled'}>${icons.spark} 교과연계 자동 작성</button></div><div class="panel"><div class="panel-title-row"><div class="panel-title">자동으로 찾은 계획</div>${state.plan?`<span class="tiny-pill">${esc(state.plan.fileName)}</span>`:''}</div>${state.plan?planPreview(l):empty('▣','아직 계획서가 없습니다','계획서 탭에서 파일을 한 번만 업로드하면 이후 계속 사용할 수 있습니다.')}</div></div>${state.result?resultCard(state.result):''}</section>`;
  }

  function planPreview(l){const m=findMatch(l.date,l.subject,l.grade);if(!m)return empty('⌕','일치 항목을 찾지 못했습니다','계획서의 과목·학년 표기와 선택값이 다른지 확인해 보세요.');return `<div class="result-mini"><div class="tiny-pill">${esc(m.week)}</div><div class="match-code">${esc(m.code||'성취기준 코드 미분리')}</div><div class="match-standard">${esc(m.standard||'성취기준 문구가 없습니다.')}</div><div class="match-content">${esc(m.content||'교과 내용이 없습니다.')}</div></div>`;}
  function resultCard(r){return `<div class="panel output-panel"><div class="panel-title-row"><div class="panel-title">${icons.spark} 교과연계 작성 결과</div><button id="save-record" class="soft">${icons.plus} 활동 기록에 저장</button></div><div class="output-meta"><span>${esc(r.week)}</span><span>${esc(r.code||'코드 없음')}</span><span>${esc(r.grade)}학년 ${esc(r.subject)}</span></div><div class="output-columns"><div><div class="mini-label">성취기준</div><div class="quote-box">${esc(r.standard)}</div></div><div><div class="mini-label">활동</div><div class="quote-box">${esc(r.activity||'활동 내용 없음')}</div></div><div class="full"><div class="mini-label">교과연계 계획</div><div class="big-output">${esc(r.linkage)}</div></div></div></div>`;}
  function activitiesPage(){const bulk=activitiesTable();return `<section class="stack"><div class="section-head"><div><div class="eyebrow">활동 설정</div><h2>교시별 활동을 한꺼번에 등록하세요.</h2><p>형식은 <b>요일 · 교시 · 학년 · 과목 · 활동내용</b>입니다. 저장한 활동은 자동 연계 화면에서 교시에 맞춰 표시됩니다.</p></div></div><div class="panel"><div class="panel-title">일괄 입력</div><textarea id="bulk" class="round-textarea bulk">${esc(bulkText())}</textarea><div class="actions"><button id="apply-bulk" class="primary">${icons.upload} 활동 저장</button><button id="clear-bulk" class="soft">입력 지우기</button></div></div><div class="activity-tabs">${state.activities.map(a=>`<button class="activity-tab active">${esc(a.day)} ${esc(a.period)}교시 <span>${esc(a.subject)}</span></button>`).join('')}</div><div class="activity-grid">${state.activities.map(a=>`<div class="activity-card"><div class="activity-card-top"><span class="time-pill">${esc(a.day)} · ${esc(a.period)}교시</span><button class="icon" data-delete-activity="${a.id}">${icons.trash}</button></div><div class="activity-title">${esc(a.grade)}학년 ${esc(a.subject)}</div><div class="activity-content">${esc(a.content)}</div></div>`).join('')}</div></section>`;}
  function bulkText(){return state.activities.map(a=>[a.day,a.period,a.grade,a.subject,a.content].join('\t')).join('\n');}
  function recordsPage(){const unique=[...new Set(state.records.map(r=>r.activity).filter(Boolean))];const selected=state.recordActivity||'all';const list=selected==='all'?state.records:state.records.filter(r=>r.activity===selected);return `<section class="stack"><div class="section-head"><div><div class="eyebrow">활동 기록</div><h2>활동에 따라 탭으로 모아보기</h2><p>저장한 교과연계 기록은 같은 활동별로 묶어 확인할 수 있습니다.</p></div></div><div class="record-tabs"><button class="record-tab ${selected==='all'?'active':''}" data-record-filter="all">전체 <span>${state.records.length}</span></button>${unique.map(n=>`<button class="record-tab ${selected===n?'active':''}" data-record-filter="${esc(n)}">${esc(n.slice(0,18))} <span>${state.records.filter(r=>r.activity===n).length}</span></button>`).join('')}</div>${list.length?`<div class="record-list">${list.map(r=>`<div class="record-card"><div class="record-card-top"><span>${esc(r.week)}</span><span>${esc(r.code||'코드 없음')}</span><span>${esc(r.grade)}학년 · ${esc(r.subject)}</span></div><h3>${esc(r.activity||'활동')}</h3><p>${esc(r.linkage)}</p><div class="record-standard"><b>${esc(r.code||'')}</b> ${esc(r.standard||'')}</div></div>`).join('')}</div>`:empty('☷','아직 저장된 기록이 없습니다','자동 연계에서 결과를 만든 뒤 활동 기록에 저장해 보세요.')}</section>`;}
  function planPage(){return `<section class="stack"><div class="section-head"><div><div class="eyebrow">학년별 교과 운영·평가 계획</div><h2>계획서는 한 번 업로드하고 계속 사용하세요.</h2><p>파일을 다시 업로드하거나 삭제하지 않는 한 이 브라우저에 저장된 계획서를 그대로 사용합니다.</p></div></div><div class="panel upload-panel"><div class="upload-icon">${icons.upload}</div><div><h3>${state.plan?esc(state.plan.fileName):'계획서 파일 업로드'}</h3><p>${state.plan?`저장 시각 ${new Date(state.plan.uploadedAt).toLocaleString('ko-KR')}`:'PDF · XLSX · XLS · DOCX · CSV · TXT 지원'}</p></div><input id="file" type="file" class="hidden" accept=".pdf,.xlsx,.xls,.docx,.csv,.txt"><button id="choose-file" class="primary">${icons.upload} ${state.plan?'계획서 교체':'파일 선택'}</button>${state.plan?`<button id="delete-plan" class="soft danger">${icons.trash} 계획서 삭제</button>`:''}</div>${state.plan?`<div class="panel"><div class="panel-title-row"><div class="panel-title">추출된 계획 항목</div><span class="tiny-pill">${state.plan.rows.length}개</span></div><div class="plan-table"><div class="plan-head"><span>주차</span><span>코드</span><span>성취기준</span><span>교과 내용</span></div>${state.plan.rows.slice(0,80).map(r=>`<div class="plan-row"><span>${esc(r.week||'-')}</span><span>${esc(r.code||'-')}</span><span>${esc(r.standard||'-')}</span><span>${esc(r.content||'-')}</span></div>`).join('')}</div></div>`:''}</section>`;}
  function empty(ic,title,text){return `<div class="empty"><div style="font-size:28px">${ic}</div><h3>${title}</h3><p>${text}</p></div>`;}

  async function parseFile(file){const ext=file.name.split('.').pop().toLowerCase();if(['xlsx','xls','csv'].includes(ext)){const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const rows=[];for(const s of wb.SheetNames){const matrix=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,defval:''});matrix.forEach(c=>rows.push({sheet:s,cells:c.map(v=>String(v??'').trim())}));}return {rawText:rows.map(r=>r.cells.join(' | ')).join('\n'),rows};}if(ext==='docx'){const out=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return {rawText:out.value,rows:[]};}if(ext==='pdf'){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let raw='';for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const txt=await page.getTextContent();raw+=`\n【${p}쪽】 `+txt.items.map(i=>i.str).join(' ');}return {rawText:raw,rows:[]};}return {rawText:await file.text(),rows:[]};}
  const CODE_RE=/\[\s*[^\]]{2,40}-\d{1,3}\s*\]|\b\d[가-힣A-Za-z()·\-]{1,20}-\d{1,3}\b/;
  const DATE_RE=/(?:\d{4}\s*[.-/]\s*)?(\d{1,2})\s*(?:월|[./\-])\s*(\d{1,2})\s*(?:일)?(?:\s*[~～\-]\s*(?:(\d{1,2})\s*(?:월|[./\-])\s*)?(\d{1,2})\s*(?:일)?)?/;
  const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
  function normalize(parsed){return parsed.rows?.length?normalizeRows(parsed.rows):normalizeText(parsed.rawText||'');}
  function normalizeRows(rows){let hi=-1;for(let i=0;i<Math.min(rows.length,70);i++){const j=rows[i].cells.join(' ');if(/성취기준|주차|기간|날짜/.test(j)){hi=i;break}}if(hi<0)hi=0;const out=[];for(let i=hi+1;i<rows.length;i++){const c=rows[i].cells;if(!c.some(Boolean))continue;const joined=c.join(' | ');const date=c.find(x=>DATE_RE.test(x))||'';const code=c.find(x=>CODE_RE.test(x))||'';const standard=c.find(x=>/성취기준/.test(x)&&x.length>5)||c.find(x=>/이해한다|설명한다|분석한다|비교한다|탐구한다|한다\.?$/.test(x)&&x.length>15)||'';const content=c.find(x=>/교과 ?내용|학습 ?내용|단원|소단원/.test(x))||'';const wk=c.find(x=>/\d+\s*월\s*\d+\s*주차|\d+주차/.test(x))||'';const subject=c.find(x=>/사회|역사|통합사회/.test(x))||'';const grade=(c.find(x=>/[1-3]\s*학년/.test(x))||'').match(/[1-3]/)?.[0]||'';const row={week:clean(wk)||weekFromDate(date),dateText:clean(date),code:clean(code),standard:clean(standard),content:clean(content||joined),subject:clean(subject),grade,source:joined};if(row.code||row.standard||row.dateText||row.week)out.push(row)}return dedupe(out)}
  function normalizeText(text){const lines=text.split(/\n+/).map(clean).filter(Boolean),out=[];let cur={};for(const line of lines){const date=line.match(DATE_RE),code=line.match(CODE_RE),wk=line.match(/(\d{1,2})월\s*(\d{1,2})주차/),grade=line.match(/([1-3])\s*학년/),subject=line.match(/(사회|역사|통합사회)/);if(date&&Object.keys(cur).length){out.push({...cur});cur={}}if(date)cur.dateText=date[0];if(wk)cur.week=`${wk[1]}월 ${wk[2]}주차`;if(grade)cur.grade=grade[1];if(subject)cur.subject=subject[1];if(code){if(cur.code)out.push({...cur,content:cur.content||''}),cur={dateText:cur.dateText,week:cur.week,grade:cur.grade,subject:cur.subject};cur.code=clean(code[0]);const rest=line.replace(code[0],'').trim();if(rest)cur.standard=clean((cur.standard||'')+' '+rest);continue}if(cur.code){if(/성취기준|이해한다|설명한다|분석한다|비교한다|탐구한다/.test(line))cur.standard=clean((cur.standard||'')+' '+line);else cur.content=clean((cur.content||'')+' '+line)}}if(Object.keys(cur).length)out.push(cur);return dedupe(out.map(r=>({...r,week:r.week||weekFromDate(r.dateText||'')})))}
  function weekFromDate(t){const m=String(t).match(DATE_RE);if(!m)return '';const y=new Date().getFullYear();return weekLabel(`${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`)}
  function dedupe(rows){const seen=new Set();return rows.filter(r=>{const k=[r.week,r.code,r.standard].join('|');if(seen.has(k))return false;seen.add(k);return true})}
  function findMatch(date,subject,grade){if(!state.plan?.rows?.length)return null;const week=weekLabel(date);const same=state.plan.rows.filter(r=>r.week===week);const sg=same.filter(r=>(!r.subject||r.subject.includes(subject)||subject.includes(r.subject))&&(!r.grade||r.grade===grade));return sg[0]||same[0]||state.plan.rows.find(r=>(!r.subject||r.subject.includes(subject))&&(!r.grade||r.grade===grade))||state.plan.rows[0];}
  function fallback(r,activity){return `${r.standard||'선택된 성취기준'}을(를) 바탕으로 ${r.content||'교과 내용'}을(를) 이해하고, ${activity||'학습 활동'}을(를) 통해 해당 개념을 실제 자료와 연결하여 정리하도록 한다.`}

  function wire(){
    const date=document.getElementById('date'),period=document.getElementById('period'),grade=document.getElementById('grade'),subject=document.getElementById('subject'),activity=document.getElementById('activity');
    const update=()=>{state.link={...state.link,date:date?.value||state.link.date,period:period?.value||state.link.period,grade:grade?.value||state.link.grade,subject:subject?.value||state.link.subject,activity:activity?.value||''};render()};
    [date,period,grade,subject].filter(Boolean).forEach(el=>el.addEventListener('change',()=>{state.link={...state.link,date:date.value,period:period.value,grade:grade.value,subject:subject.value};const day=dayNames[new Date(date.value+'T00:00:00').getDay()];const m=state.activities.find(a=>a.day===day&&a.period===period.value&&a.grade===grade.value&&a.subject===subject.value);state.link.activity=m?.content||'';render()}));
    document.querySelectorAll('[data-pick-activity]').forEach(b=>b.onclick=()=>{const a=state.activities.find(x=>x.id===b.dataset.pickActivity);state.link.activity=a?.content||'';render()});
    document.getElementById('generate')?.addEventListener('click',generate);
    document.getElementById('save-record')?.addEventListener('click',async()=>{state.records.unshift(state.result);await saveRecords();state.tab='records';state.notice='활동 기록에 저장했습니다.';render()});
    document.getElementById('choose-file')?.addEventListener('click',()=>document.getElementById('file').click());
    document.getElementById('file')?.addEventListener('change',e=>e.target.files?.[0]&&handlePlan(e.target.files[0]));
    document.getElementById('delete-plan')?.addEventListener('click',async()=>{if(confirm('저장된 계획서를 삭제할까요? 활동 기록은 유지됩니다.')){state.plan=null;await dbDel('plan');state.notice='계획서를 삭제했습니다.';render()}});
    document.getElementById('apply-bulk')?.addEventListener('click',async()=>{const rows=document.getElementById('bulk').value.split(/\n+/).map(x=>x.split('\t')).filter(r=>r.length>=5).map((r,i)=>({id:'a-'+Date.now()+'-'+i,day:r[0].trim(),period:r[1].trim(),grade:r[2].trim(),subject:r[3].trim(),content:r.slice(4).join(' ').trim()})).filter(x=>x.day&&x.period&&x.grade&&x.subject&&x.content);state.activities=rows;await saveActivities();state.notice=`${rows.length}개의 활동 시간을 저장했습니다.`;render()});
    document.getElementById('clear-bulk')?.addEventListener('click',()=>{document.getElementById('bulk').value=''});
    document.querySelectorAll('[data-delete-activity]').forEach(b=>b.onclick=async()=>{state.activities=state.activities.filter(a=>a.id!==b.dataset.deleteActivity);await saveActivities();state.notice='활동을 삭제했습니다.';render()});
    document.querySelectorAll('[data-record-filter]').forEach(b=>b.onclick=()=>{state.recordActivity=b.dataset.recordFilter;render()});
  }

  async function handlePlan(file){try{state.notice='계획서를 읽고 있습니다…';render();const parsed=await parseFile(file);const rows=normalize(parsed);if(!rows.length)throw new Error('주차·성취기준 정보를 충분히 찾지 못했습니다. 텍스트가 추출되는 PDF/DOCX/XLSX인지 확인해 주세요.');state.plan={fileName:file.name,uploadedAt:now(),rows,rawPreview:parsed.rawText.slice(0,12000)};await dbSet('plan',state.plan);state.notice=`저장 완료 · ${rows.length}개 계획 항목`;render()}catch(e){state.notice='읽기 실패 · '+e.message;render()}}

  async function generate(){const l=state.link,m=findMatch(l.date,l.subject,l.grade);if(!m){state.notice='선택한 날짜에 맞는 성취기준 항목을 찾지 못했습니다.';render();return}const activity=l.activity.trim();state.notice='성취기준과 활동을 연결하고 있습니다…';render();try{const resp=await fetch('/api/generate-linkage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:l.grade,subject:l.subject,date:l.date,week:m.week,code:m.code,standard:m.standard,content:m.content,activity})});const data=resp.ok?await resp.json():{};state.result={...m,activity,grade:l.grade,subject:l.subject,linkage:data.linkage||fallback(m,activity),generatedAt:now(),id:'r-'+Date.now()};state.notice=data.source==='gemini'?'Gemini로 교과연계를 작성했습니다.':'기본 연계 문구로 작성했습니다. Vercel에 GEMINI_API_KEY를 설정하면 AI 문구를 사용할 수 있습니다.';render()}catch{state.result={...m,activity,grade:l.grade,subject:l.subject,linkage:fallback(m,activity),generatedAt:now(),id:'r-'+Date.now()};state.notice='AI 연결에 실패하여 기본 연계 문구로 작성했습니다.';render()}}

  init();
</script>
</body>
