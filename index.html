    .records-list{display:flex;flex-direction:column;gap:12px}.record-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px}.record-top{display:flex;gap:7px;flex-wrap:wrap}.record-card h3{font-size:15px;margin:12px 0 6px}.record-card p{font-size:14px;line-height:1.72;margin:0 0 12px}.record-standard{padding:11px;border-radius:14px;background:#f7f6f1;color:#666d69;font-size:12px}.record-actions{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-top:13px}.ai-organize{margin-top:16px;padding:15px;border:1px solid #dce0d8;border-radius:19px;background:#f7f8f3}.ai-organize-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ai-title{font-weight:950;font-size:14px}.ai-caption{font-size:12px;color:#777d79;margin-top:4px}.ai-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-top:12px}.ai-preview{margin-top:12px}.ai-preview-table{min-width:980px}.ai-status{padding:10px 12px;border-radius:14px;background:#ecefe7;color:#5e655f;font-size:12px;font-weight:800}.suggested-chip{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:#fff;border:1px solid #dbded7;color:#646a65;font-size:11px;font-weight:850;margin:3px 4px 0 0}
    .empty{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#8a8f8c}.empty h3{margin:12px 0 5px;color:#3f4541}.empty p{margin:0;max-width:360px;font-size:13px}.footer{text-align:center;color:#969b98;font-size:11px;padding:26px}.hidden{display:none!important}.danger-text{color:var(--danger)}
    @media(max-width:960px){.grid-two{grid-template-columns:1fr}.activity-grid{grid-template-columns:1fr 1fr}.file-controls{grid-template-columns:1fr 1fr}.hero-card{align-items:flex-start;flex-direction:column}}
    @media(max-width:650px){.topbar{padding:0 16px}.main-tabs{padding-left:16px;padding-right:16px}.content{padding:18px 14px 80px}.field-grid,.output-columns,.activity-grid,.activity-toolbar,.upload-zone{grid-template-columns:1fr}.file-controls{grid-template-columns:1fr}.full{grid-column:auto}.brand-sub{display:none}}

<body>
<div id="app" class="app"></div>
<script type="module">
  const DB='curriculum-linker-v2', STORE='data';
  const state={
    tab:'link',
    planFilter:'all',
    activityFilter:'all',
    recordFilter:'all',
    plans:[],
    activities:[],
    records:[],
    link:{date:'2026-10-06',period:'1',grade:'1',subject:'사회',activity:'',activityId:'',planRowId:'',activityGroup:''},
    result:null,
    notice:'',
    busy:false,
    activityAiBusy:false,
    activityAiPreview:[]
  };
  let pdfjsLib=null;
  try{ pdfjsLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs'); pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs'; }catch(e){ pdfjsLib=null; }

  const icons={spark:'✦',upload:'↑',book:'▣',clock:'◷',record:'☷',search:'⌕',trash:'×',plus:'＋',file:'▤',edit:'✎'};
  const dayNames=['일','월','화','수','목','금','토'];
  const subjects=['사회','역사','통합사회','도덕','국어','영어','수학','과학','기술·가정','정보','체육','미술','음악','기타'];
  const grades=['공통','1','2','3'];
  const clean=s=>String(s??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const now=()=>new Date().toISOString();
  const makeId=(p='id')=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);

  function weekLabel(iso){
    const d=new Date(iso+'T00:00:00');
    if(Number.isNaN(d.getTime())) return '';
    const first=new Date(d.getFullYear(),d.getMonth(),1);
    const mondayIndex=(first.getDay()+6)%7;
    const week=Math.floor((d.getDate()+mondayIndex-1)/7)+1;
    return `${d.getMonth()+1}월 ${week}주차`;
  }
  const DATE_RE=/(?:\d{4}\s*[./-]\s*)?(\d{1,2})\s*(?:월|[./-])\s*(\d{1,2})\s*(?:일)?(?:\s*[~～-]\s*(?:(\d{1,2})\s*(?:월|[./-])\s*)?(\d{1,2})\s*(?:일)?)?/;
  const WEEK_RE=/(\d{1,2})\s*월\s*(\d{1,2})\s*주차|(\d{1,2})\s*주차/;
  const CODE_RE=/\[[^\]]{2,50}-\d{1,3}\]|\b\d{1,2}[가-힣A-Za-z()·\-]{0,18}-\d{1,3}\b/;

  function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function dbGet(k){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function dbSet(k,v){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
  async function dbDel(k){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

  function inferGrade(text){const m=String(text).match(/(?:중학교\s*)?([1-3])\s*학년/);return m?m[1]:''}
  function inferSubject(text){const s=subjects.find(x=>String(text).includes(x));return s||''}
  function weekFromDateText(t){const m=String(t).match(DATE_RE);if(!m)return '';const y=new Date().getFullYear();return weekLabel(`${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]||m[1]).padStart(2,'0')}`)}
  function extractWeek(s){const m=String(s).match(WEEK_RE);if(!m)return '';return m[1]?`${m[1]}월 ${m[2]}주차`:`${m[3]}주차`;}

  function findCell(cells,re){return cells.find(x=>re.test(String(x)))||''}
  function normalizeRows(rows,fileName){
    const matrix=rows.map(r=>r.cells.map(clean));
    let headerIndex=-1;
    for(let i=0;i<Math.min(matrix.length,100);i++){
      const joined=matrix[i].join(' ');
      if(/성취기준|주차|기간|날짜/.test(joined) && (CODE_RE.test(joined)||/성취기준/.test(joined))){headerIndex=i;break}
    }
    const header=headerIndex>=0?matrix[headerIndex]:[];
    const idx={
      week:header.findIndex(x=>/주차|주|기간/.test(x)),
      date:header.findIndex(x=>/날짜|기간/.test(x)),
      code:header.findIndex(x=>/성취기준 ?코드|코드/.test(x)),
      standard:header.findIndex(x=>/성취기준/.test(x)&&!/코드/.test(x)),
      content:header.findIndex(x=>/교과 ?내용|학습 ?내용|단원|소단원/.test(x)),
      subject:header.findIndex(x=>/과목|교과/.test(x)),
      grade:header.findIndex(x=>/학년/.test(x))
    };
    const out=[]; const carry={};
    const start=Math.max(0,headerIndex+1);
    for(let i=start;i<matrix.length;i++){
      const c=matrix[i]; if(!c.some(Boolean))continue;
      const rowText=c.join(' | ');
      const week=clean(idx.week>=0?c[idx.week]:findCell(c,WEEK_RE)) || carry.week || extractWeek(rowText);
      const dateText=clean(idx.date>=0?c[idx.date]:findCell(c,DATE_RE)) || carry.dateText;
      const code=clean(idx.code>=0?c[idx.code]:findCell(c,CODE_RE));
      const standard=clean(idx.standard>=0?c[idx.standard]:'') || (c.find(x=>/(이해한다|설명한다|분석한다|비교한다|탐구한다|실천한다|한다\.?$)/.test(x)&&x.length>15)||'');
      const content=clean(idx.content>=0?c[idx.content]:'') || c.filter(Boolean).filter(x=>x!==standard&&x!==code).join(' | ');
      const subject=clean(idx.subject>=0?c[idx.subject]:'') || inferSubject(rowText) || carry.subject || inferSubject(fileName);
      const grade=clean(idx.grade>=0?c[idx.grade]:'') || inferGrade(rowText) || carry.grade || inferGrade(fileName);
      if(week)carry.week=week;if(dateText)carry.dateText=dateText;if(subject)carry.subject=subject;if(grade)carry.grade=grade;
      if(code||standard||dateText||week){
        const w=extractWeek(week)||week||(dateText?weekFromDateText(dateText):'');
        out.push({id:makeId('row'),week:w,dateText,code,standard,content,subject,grade:grade.match(/[1-3]/)?.[0]||grade,source:rowText});
      }
    }
    return dedupe(out);
  }
  function normalizeText(text,fileName){
    const lines=String(text).split(/\n+/).map(clean).filter(Boolean); const out=[]; let current={};
    for(const line of lines){
      const w=extractWeek(line), date=line.match(DATE_RE)?.[0]||'', code=line.match(CODE_RE)?.[0]||'', grade=inferGrade(line), subject=inferSubject(line);
      if(w){if(current.code||current.standard||current.dateText) out.push(finalizeRow(current)); current={...current,week:w};}
      if(date) current.dateText=date;
      if(grade) current.grade=grade;
      if(subject) current.subject=subject;
      if(code){if(current.code){out.push(finalizeRow(current));current={week:current.week,dateText:current.dateText,grade:current.grade,subject:current.subject};} current.code=code; const rest=clean(line.replace(code,'')); if(rest)current.standard=clean((current.standard||'')+' '+rest); continue;}
      if(current.code||current.standard){if(/이해한다|설명한다|분석한다|비교한다|탐구한다|실천한다|성취기준/.test(line)) current.standard=clean((current.standard||'')+' '+line); else current.content=clean((current.content||'')+' '+line)}
    }
    if(current.code||current.standard||current.dateText||current.week)out.push(finalizeRow(current));
    return dedupe(out);
    function finalizeRow(r){return {id:makeId('row'),week:r.week||extractWeek(r.dateText)||weekFromDateText(r.dateText),dateText:r.dateText||'',code:r.code||'',standard:r.standard||'',content:r.content||'',subject:r.subject||inferSubject(fileName)||'',grade:r.grade||inferGrade(fileName)||'',source:[r.code,r.standard,r.content].filter(Boolean).join(' | ')}}
  }
  function dedupe(rows){const seen=new Set();return rows.filter(r=>{const k=[r.week,r.code,r.standard,r.content].join('|');if(seen.has(k))return false;seen.add(k);return true})}

  async function parseFile(file){
    const ext=file.name.split('.').pop().toLowerCase();
    if(['xlsx','xls','csv'].includes(ext)){
      if(!window.XLSX) throw new Error('표 파일 읽기 기능을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
      const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const rows=[];let raw='';
      for(const s of wb.SheetNames){const matrix=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,defval:''});matrix.forEach(c=>rows.push({sheet:s,cells:c.map(v=>String(v??'').trim())}));raw+=`\n[${s}]\n`+matrix.map(c=>c.map(v=>String(v??'').trim()).join(' | ')).join('\n');}
      return {rows,rawText:raw};
    }
    if(ext==='docx'){
      if(!window.mammoth) throw new Error('DOCX 읽기 기능을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
      const out=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return {rows:[],rawText:out.value};
    }
    if(ext==='pdf'){
      if(!pdfjsLib) throw new Error('PDF 읽기 모듈을 불러오지 못했습니다. 가능하면 XLSX/DOCX 파일을 사용해 주세요.');
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let raw='';
      for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const txt=await page.getTextContent();raw+=`\n【${p}쪽】 `+txt.items.map(i=>i.str).join(' ');}return {rows:[],rawText:raw};
    }
    return {rows:[],rawText:await file.text()};
  }

  function normalizeParsed(parsed,fileName){return parsed.rows?.length?normalizeRows(parsed.rows,fileName):normalizeText(parsed.rawText||'',fileName)}
  function saveAll(){return Promise.all([dbSet('plans',state.plans),dbSet('activities',state.activities),dbSet('records',state.records)])}

  async function init(){

      state.activities=Array.isArray(activities)?activities:[];
      if(!state.activities.length){state.activities=[
        {id:makeId('a'),day:'월',period:'1',grade:'1',subject:'사회',content:'자료를 읽고 핵심 개념을 정리하는 활동',group:'자료 분석'},
        {id:makeId('a'),day:'화',period:'2',grade:'1',subject:'사회',content:'모둠별로 자료를 비교하고 발표하는 활동',group:'모둠 발표'},
        {id:makeId('a'),day:'수',period:'3',grade:'2',subject:'역사',content:'역사 자료를 조사하고 사건의 영향을 설명하는 활동',group:'자료 조사'}
      ];await dbSet('activities',state.activities);}
      state.records=Array.isArray(records)?records:[];
    }catch(e){state.notice='저장된 정보를 불러오지 못했습니다. 브라우저 저장공간을 확인해 주세요.';}
    render();
  }

  function filteredPlans(){
    return state.plans.filter(p=>state.planFilter==='all'||p.defaultGrade===state.planFilter||p.rows.some(r=>r.grade===state.planFilter));
  }
  function findMatches(date,subject,grade){
    if(!date)return [];
    const week=weekLabel(date); const out=[];
    for(const p of state.plans){
      const planGradeOk=p.defaultGrade===''||p.defaultGrade==='공통'||p.defaultGrade===grade||p.rows.some(r=>r.grade===grade);
      const planSubjectOk=!p.defaultSubject||p.defaultSubject==='기타'||p.defaultSubject===subject||p.rows.some(r=>!r.subject||r.subject===subject||r.subject.includes(subject)||subject.includes(r.subject));
      if(!planGradeOk||!planSubjectOk)continue;
      for(const r of p.rows){
        const rowGrade=!r.grade||r.grade===grade; const rowSubject=!r.subject||r.subject===subject||r.subject.includes(subject)||subject.includes(r.subject); const rowWeek=r.week===week;
        if(rowWeek&&rowGrade&&rowSubject) out.push({...r,planId:p.id,planName:p.fileName});
      }
    }
    return out.sort((a,b)=>((a.grade?0:1)-(b.grade?0:1))+((a.subject?0:1)-(b.subject?0:1)));
  }
  function getSelectedMatch(){const matches=findMatches(state.link.date,state.link.subject,state.link.grade);return matches.find(x=>x.id===state.link.planRowId)||matches[0]||null}
  function activityMatches(){const date=state.link.date;const day=date?dayNames[new Date(date+'T00:00:00').getDay()]:'';return state.activities.filter(a=>a.day===day&&a.period===state.link.period&&a.grade===state.link.grade&&a.subject===state.link.subject)}
  function fallback(r,activity){return `${r.standard||'선택된 성취기준'}을(를) 바탕으로 ${r.content||'교과 내용'}을(를) 이해하고, ${activity||'학습 활동'}을(를) 통해 해당 개념을 실제 수업 활동과 연결하도록 한다.`}
  function activityGroups(){return [...new Set(state.activities.map(a=>a.group||'기본 활동'))].filter(Boolean)}
  function recordGroups(){return [...new Set(state.records.map(r=>r.activityGroup||r.activity||'기본 활동'))].filter(Boolean)}

  function baseLayout(content){return `<header class="topbar"><div class="brand"><div class="brand-dot">${icons.spark}</div><div><div class="brand-title">교과연계 기록</div><div class="brand-sub">중학교 1·2·3학년 · 날짜로 주차 자동 연결</div></div></div><div>${state.plans.length?`<span class="saved-pill"><span class="status-dot"></span> 계획서 ${state.plans.length}개 저장</span>`:`<span class="saved-pill">계획서를 업로드해 주세요</span>`}</div></header><nav class="main-tabs"><button class="tab ${state.tab==='link'?'active':''}" data-tab="link">${icons.spark} 자동 연계</button><button class="tab ${state.tab==='activities'?'active':''}" data-tab="activities">${icons.clock} 활동 설정</button><button class="tab ${state.tab==='records'?'active':''}" data-tab="records">${icons.record} 활동 기록</button><button class="tab ${state.tab==='plan'?'active':''}" data-tab="plan">${icons.file} 교과연계 파일</button></nav><main class="content">${state.notice?`<div class="notice">${esc(state.notice)}</div>`:''}${content}</main><footer class="footer">계획서와 활동은 이 브라우저에 저장되며, 파일을 새로 올리기 전까지 유지됩니다.</footer>`}

.length?`<div class="plan-match-list">${plans.slice(0,10).map((m,i)=>`<div class="match-card ${m.id===l.planRowId||(i===0&&!l.planRowId)?'selected':''}"><button data-pick-plan="${esc(m.id)}"><div class="match-card-title">${esc(m.code||'성취기준 코드 없음')} · ${esc(m.planName)}</div><div class="match-card-sub">${esc(m.standard||'성취기준 문구 없음')}</div><div class="match-card-sub">${esc(m.content||'교과 내용 없음')}</div></button></div>`).join('')}</div>`:empty('⌕','일치하는 계획이 없습니다',`${esc(week)}의 ${esc(l.grade)}학년 ${esc(l.subject)} 항목을 계획서에서 찾지 못했습니다.`):empty('▣','계획서가 없습니다','교과연계 파일 탭에서 여러 계획서를 한꺼번에 올릴 수 있습니다.')}</div></div>${state.result?resultCard(state.result):''}</section>`;

    return `<section class="stack"><div class="section-head"><div class="eyebrow">교과연계 파일 관리</div><h2>계획서는 여러 개 올려 두고 각각 관리하세요.</h2><p>1·2·3학년 파일을 한 번에 여러 개 선택할 수 있습니다. 파일을 추가해도 기존 파일은 삭제되지 않습니다.</p></div><div class="panel upload-zone"><div class="upload-copy"><h3>학년별 교과 운영·평가 계획서 추가</h3><p>PDF · XLSX · XLS · DOCX · CSV · TXT · 다중 파일 업로드 지원</p><div class="upload-grid"><span class="file-badge">주차 자동 판별</span><span class="file-badge">성취기준 코드 추출</span><span class="file-badge">학년·과목별 연결</span></div></div><div><input id="plan-files" type="file" class="hidden" accept=".pdf,.xlsx,.xls,.docx,.csv,.txt" multiple><button id="choose-plan-files" class="primary">${icons.upload} 여러 파일 선택</button></div></div><div class="subnav">${filters.map(g=>`<button class="subtab ${state.planFilter===g?'active':''}" data-plan-filter="${g}">${g==='all'?'전체':g+'학년'} <span>${g==='all'?state.plans.length:list.length}</span></button>`).join('')}</div>${list.length?`<div class="stack">${list.map(p=>planCard(p)).join('')}</div>`:empty('▤','저장된 계획서가 없습니다','학년별 운영·평가 계획서를 여러 개 선택해서 올려 주세요.')}</section>`;
  }
  function planCard(p){return `<div class="file-card"><div class="file-card-top"><div><div class="file-name">${esc(p.fileName)}</div><div class="file-sub">업로드 ${new Date(p.uploadedAt).toLocaleString('ko-KR')} · ${p.rows.length}개 항목</div></div><button class="danger" data-delete-plan="${esc(p.id)}">${icons.trash} 이 파일 삭제</button></div><div class="file-controls"><label class="field">기본 학년<select data-plan-edit="defaultGrade" data-id="${esc(p.id)}">${grades.map(g=>`<option value="${esc(g)}" ${String(p.defaultGrade||'')===g?'selected':''}>${g==='공통'?'공통':g+'학년'}</option>`).join('')}</select></label><label class="field">기본 과목<select data-plan-edit="defaultSubject" data-id="${esc(p.id)}">${['',...subjects].map(s=>`<option value="${esc(s)}" ${String(p.defaultSubject||'')===s?'selected':''}>${s||'자동 감지'}</option>`).join('')}</select></label><div><div class="mini-label">자동으로 읽은 정보</div><div class="muted">${esc(p.rows[0]?.grade?p.rows[0].grade+'학년':'학년 미확인')} · ${esc(p.rows[0]?.subject||'과목 미확인')} · ${esc(p.rows[0]?.week||'주차 미확인')}</div></div><button class="soft" data-toggle-preview="${esc(p.id)}">${icons.search} 내용 보기</button></div>${p.showPreview?`<div class="file-preview">${esc(p.rawPreview||p.rows.slice(0,30).map(r=>[r.week,r.code,r.standard,r.content].filter(Boolean).join(' | ')).join('\n'))}</div>`:''}</div>`;}

  function recordsPage(){
    const groups=['all',...recordGroups()]; const list=state.recordFilter==='all'?state.records:state.records.filter(r=>(r.activityGroup||r.activity||'기본 활동')===state.recordFilter);
    return `<section class="stack"><div class="section-head"><div class="eyebrow">활동 기록</div><h2>활동별 탭으로 교과연계를 모아보세요.</h2><p>같은 활동 유형은 같은 탭에 쌓입니다. 기록 문구는 저장 후에도 삭제하거나 다시 확인할 수 있습니다.</p></div><div class="subnav">${groups.map(g=>`<button class="subtab ${state.recordFilter===g?'active':''}" data-record-filter="${esc(g)}">${g==='all'?'전체':esc(g)} <span>${g==='all'?state.records.length:state.records.filter(r=>(r.activityGroup||r.activity||'기본 활동')===g).length}</span></button>`).join('')}</div>${list.length?`<div class="records-list">${list.map(r=>`<div class="record-card"><div class="record-top"><span class="meta-pill">${esc(r.week)}</span><span class="meta-pill">${esc(r.code||'코드 없음')}</span><span class="meta-pill">${esc(r.grade)}학년 · ${esc(r.subject)}</span><span class="meta-pill">${esc(r.activityGroup||'기본 활동')}</span></div><h3>${esc(r.activity||'활동')}</h3><p>${esc(r.linkage)}</p><div class="record-standard"><b>${esc(r.code||'')}</b> ${esc(r.standard||'')}</div><div class="record-actions"><span class="muted">${new Date(r.generatedAt||now()).toLocaleString('ko-KR')}</span><button class="danger" data-delete-record="${esc(r.id)}">기록 삭제</button></div></div>`).join('')}</div>`:empty('☷','아직 저장된 기록이 없습니다','자동 연계에서 교과연계 결과를 만든 뒤 활동 기록에 저장해 보세요.')}</section>`;
  }
  function empty(ic,title,text){return `<div class="empty"><div style="font-size:28px">${ic}</div><h3>${title}</h3><p>${text}</p></div>`}

  function page(){if(state.tab==='activities')return activitiesPage();if(state.tab==='records')return recordsPage();if(state.tab==='plan')return planPage();return linkPage()}
  function render(){document.getElementById('app').innerHTML=baseLayout(page());wire();}

  function parseActivityLines(text, defaults={}){
    return String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map((line,i)=>{
      const c=line.includes('\t')?line.split('\t'):line.split(/\s{2,}/); if(c.length<5)return null;
      const [dayRaw,periodRaw,gradeRaw,subjectRaw,contentRaw,...rest]=c.map(clean);
      const day=dayRaw.replace(/요일$/,'').replace(/^\S*\s*([월화수목금])\S*$/,'$1');
      const period=(periodRaw.match(/[1-7]/)||[''])[0];
      const grade=(gradeRaw.match(/[1-3]/)||[defaults.grade||''])[0];
      const subject=subjectRaw||defaults.subject||inferSubject(line);
      const group=clean(rest.join(' '))||inferActivityGroup(contentRaw)||'기본 활동';
      return {id:makeId('a'),day,period,grade,subject,content:clean(contentRaw),group};
    }).filter(x=>x&&['월','화','수','목','금'].includes(x.day)&&['1','2','3','4','5','6','7'].includes(x.period)&&['1','2','3'].includes(x.grade)&&x.subject&&x.content);
  }

  function inferActivityGroup(text){
    const t=String(text||'');
    const rules=[
      ['토론',['토론','토의','쟁점 토론','디베이트']],
      ['발표',['발표','프레젠테이션','설명하고 발표']],
      ['자료 조사',['자료 조사','조사하기','탐구 자료 찾기','검색']],
      ['자료 분석',['자료 분석','자료를 분석','사료 분석','그래프 분석','표 분석','읽고 핵심']],
      ['모둠 협력',['모둠','협력','협동']],
      ['프로젝트',['프로젝트','기획','만들기','제작']],
      ['퀴즈',['퀴즈','문제 풀이','문제풀기']],
      ['글쓰기',['서술','논술','글쓰기','작성하기','보고서 작성']],
      ['체험·실습',['체험','실습','활동지','실험']]
    ];
    for(const [g,words] of rules)if(words.some(w=>t.includes(w)))return g;
    return '기본 활동';
  }

  function normalizeAiActivities(items,defaults={}){
    const arr=Array.isArray(items)?items:(Array.isArray(items?.activities)?items.activities:[]);
    return arr.map(x=>{
      const day=String(x.day||'').replace(/요일/g,'').trim().slice(-1);
      const period=(String(x.period||'').match(/[1-7]/)||[''])[0];
      const grade=(String(x.grade||'').match(/[1-3]/)||[defaults.grade||''])[0];
      const subject=subjects.includes(String(x.subject||''))?String(x.subject):inferSubject(`${x.subject||''} ${x.content||''}`)||defaults.subject||'기타';
      const content=clean(x.content||x.activity||x.activityContent||'');
      const group=clean(x.group||x.activityGroup||'')||inferActivityGroup(content)||'기본 활동';
      return {id:makeId('a'),day,period,grade,subject,content,group};
    }).filter(x=>['월','화','수','목','금'].includes(x.day)&&['1','2','3','4','5','6','7'].includes(x.period)&&['1','2','3'].includes(x.grade)&&x.subject&&x.content);
  }

  async function aiOrganizeActivities(text,defaults={}){
    if(!String(text||'').trim())throw new Error('먼저 활동 내용을 붙여 넣어 주세요.');
    const resp=await fetch('/api/organize-activities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:String(text),defaults})});
    const data=resp.ok?await resp.json():null;
    if(!resp.ok||!data)throw new Error(data?.message||'AI 정리에 실패했습니다.');
    if(!Array.isArray(data.activities)||!data.activities.length)throw new Error('AI가 활동 정보를 찾지 못했습니다. 표의 행과 열이 보이도록 다시 붙여 넣어 주세요.');
    return {activities:normalizeAiActivities(data.activities,defaults),source:data.source||'gemini'};
  }

  async function uploadPlans(files){
    if(!files.length)return; state.busy=true; state.notice=`${files.length}개 파일을 읽는 중입니다…`; render();
    let ok=0;const failed=[];
    for(const file of files){
      try{
        const parsed=await parseFile(file);const rows=normalizeParsed(parsed,file.name);if(!rows.length)throw new Error('주차·성취기준 정보를 찾지 못했습니다.');
        const plan={id:makeId('plan'),fileName:file.name,uploadedAt:now(),defaultGrade:inferGrade(file.name),defaultSubject:inferSubject(file.name),rows,rawPreview:(parsed.rawText||'').slice(0,14000),showPreview:false};
        state.plans.push(plan);ok++;
      }catch(e){failed.push(`${file.name}: ${e.message}`)}
    }
    await dbSet('plans',state.plans); state.busy=false; state.notice=failed.length?`${ok}개 저장 완료 · 실패 ${failed.length}개: ${failed.join(' / ')}`:`${ok}개 계획서를 저장했습니다. 기존 계획서는 그대로 유지됩니다.`;render();
  }

  async function generate(){
    const m=getSelectedMatch(); if(!m){state.notice='선택한 날짜·학년·과목의 계획서 항목이 없습니다.';render();return}
    const activity=String(state.link.activity||'').trim();if(!activity){state.notice='활동 내용을 입력하거나 등록된 활동을 선택해 주세요.';render();return}
    state.notice='교과 내용과 활동을 연결하고 있습니다…';render();
    try{
      const resp=await fetch('/api/generate-linkage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:state.link.grade,subject:state.link.subject,date:state.link.date,week:m.week,code:m.code,standard:m.standard,content:m.content,activity})});
      const data=resp.ok?await resp.json():{};
      state.result={...m,grade:state.link.grade,subject:state.link.subject,activity,activityGroup:state.link.activityGroup||'기본 활동',linkage:data.linkage||fallback(m,activity),generatedAt:now(),id:makeId('r'),source:data.source||'fallback'};
      state.notice=data.source==='gemini'?'Gemini로 작성했습니다. 필요하면 문구를 직접 수정한 뒤 기록으로 저장할 수 있습니다.':'기본 연계 문구로 작성했습니다. Vercel의 GEMINI_API_KEY를 확인해 주세요.';
    }catch(e){state.result={...m,grade:state.link.grade,subject:state.link.subject,activity,activityGroup:state.link.activityGroup||'기본 활동',linkage:fallback(m,activity),generatedAt:now(),id:makeId('r'),source:'fallback'};state.notice='AI 연결에 실패하여 기본 연계 문구를 표시했습니다.';}
    render();
  }

  async function saveResult(){
    if(!state.result)return;const edited=document.getElementById('linkage-edit')?.value?.trim();if(edited)state.result.linkage=edited;const existing=state.records.findIndex(r=>r.id===state.result.id);if(existing>=0)state.records[existing]=state.result;else state.records.unshift(state.result);await dbSet('records',state.records);state.notice='활동 기록에 저장했습니다.';state.tab='records';render();
  }

  function setLinkFromSelection(partial){
    state.link={...state.link,...partial};
    const matches=activityMatches();
    if(!partial.activityId){const first=matches[0];state.link.activityId=first?.id||'';state.link.activity=first?.content||'';state.link.activityGroup=first?.group||'';}
    const pm=findMatches(state.link.date,state.link.subject,state.link.grade);state.link.planRowId=pm[0]?.id||'';
  }

  function wire(){
    const app=document.getElementById('app');
    app.onclick=async e=>{
      const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;state.notice='';render();return}
      const af=e.target.closest('[data-activity-filter]');if(af){state.activityFilter=af.dataset.activityFilter;render();return}
      const pf=e.target.closest('[data-plan-filter]');if(pf){state.planFilter=pf.dataset.planFilter;render();return}
      const rf=e.target.closest('[data-record-filter]');if(rf){state.recordFilter=rf.dataset.recordFilter;render();return}
      const pa=e.target.closest('[data-pick-activity]');if(pa){const a=state.activities.find(x=>x.id===pa.dataset.pickActivity);if(a){state.link.activityId=a.id;state.link.activity=a.content;state.link.activityGroup=a.group||'기본 활동';render();}return}
      const pp=e.target.closest('[data-pick-plan]');if(pp){state.link.planRowId=pp.dataset.pickPlan;render();return}
      const btn=e.target.closest('#generate');if(btn){await generate();return}
      if(e.target.closest('#save-record')||e.target.closest('#save-record-alt')){await saveResult();return}
      if(e.target.closest('#apply-linkage-edit')){if(state.result){state.result.linkage=document.getElementById('linkage-edit').value.trim();state.notice='수정한 교과연계 문구를 반영했습니다.';render();}return}
      if(e.target.closest('#choose-plan-files')){document.getElementById('plan-files')?.click();return}
      if(e.target.closest('#choose-activity-file')){document.getElementById('activity-file')?.click();return}
      const delp=e.target.closest('[data-delete-plan]');if(delp){if(confirm('이 계획서 파일을 삭제할까요? 다른 파일과 기록에는 영향을 주지 않습니다.')){state.plans=state.plans.filter(p=>p.id!==delp.dataset.deletePlan);await dbSet('plans',state.plans);state.notice='계획서를 삭제했습니다.';render();}return}
      const tp=e.target.closest('[data-toggle-preview]');if(tp){const p=state.plans.find(x=>x.id===tp.dataset.togglePreview);if(p){p.showPreview=!p.showPreview;await dbSet('plans',state.plans);render();}return}
      const da=e.target.closest('[data-delete-activity]');if(da){state.activities=state.activities.filter(a=>a.id!==da.dataset.deleteActivity);await dbSet('activities',state.activities);state.notice='활동을 삭제했습니다.';render();return}
      const dr=e.target.closest('[data-delete-record]');if(dr){state.records=state.records.filter(r=>r.id!==dr.dataset.deleteRecord);await dbSet('records',state.records);state.notice='기록을 삭제했습니다.';render();return}
      if(e.target.closest('#append-bulk')){const rows=parseActivityLines(document.getElementById('bulk').value);if(!rows.length){state.notice='활동 형식을 확인해 주세요.';render();return}state.activities.push(...rows);await dbSet('activities',state.activities);state.notice=`${rows.length}개 활동을 추가했습니다.`;render();return}
      if(e.target.closest('#replace-bulk')){const rows=parseActivityLines(document.getElementById('bulk').value);if(!rows.length){state.notice='활동 형식을 확인해 주세요.';render();return}state.activities=rows;await dbSet('activities',state.activities);state.notice=`활동 ${rows.length}개로 교체했습니다.`;render();return}
      if(e.target.closest('#ai-organize-activities')){
        const text=document.getElementById('bulk')?.value||'';
        const defaults={grade:document.getElementById('ai-default-grade')?.value||state.link.grade,subject:document.getElementById('ai-default-subject')?.value||state.link.subject};
        if(!text.trim()){state.notice='먼저 활동 내용을 붙여 넣어 주세요.';render();return}
        state.activityAiBusy=true;state.notice='붙여 넣은 활동표를 AI가 정리하고 있습니다…';render();
        try{const out=await aiOrganizeActivities(text,defaults);state.activityAiPreview=out.activities;state.notice=out.source==='gemini'?`AI가 ${out.activities.length}개 활동으로 정리했습니다. 검토 후 저장하세요.`:`AI 연결 없이 기본 정리 방식으로 ${out.activities.length}개 활동을 찾았습니다. 검토 후 저장하세요.`;}
        catch(err){state.notice='AI 자동 정리 실패 · '+err.message;}
        finally{state.activityAiBusy=false;render();}
        return;
      }
      if(e.target.closest('#save-ai-append')){
        const rows=state.activityAiPreview||[];if(!rows.length){state.notice='저장할 AI 정리 결과가 없습니다.';render();return}
        state.activities.push(...rows.map(a=>({...a,id:makeId('a')})));await dbSet('activities',state.activities);state.notice=`AI가 정리한 ${rows.length}개 활동을 추가했습니다.`;state.activityAiPreview=[];render();return;
      }
      if(e.target.closest('#save-ai-replace')){
        const rows=state.activityAiPreview||[];if(!rows.length){state.notice='저장할 AI 정리 결과가 없습니다.';render();return}
        state.activities=rows.map(a=>({...a,id:makeId('a')}));await dbSet('activities',state.activities);state.notice=`AI 정리 결과 ${rows.length}개 활동으로 교체했습니다.`;state.activityAiPreview=[];render();return;
      }
      if(e.target.closest('#clear-ai-preview')){state.activityAiPreview=[];render();return}
      if(e.target.closest('#clear-bulk')){document.getElementById('bulk').value='';state.activityAiPreview=[];return}
    };
    app.onchange=async e=>{
      if(e.target.id==='date'||e.target.id==='period'||e.target.id==='grade'||e.target.id==='subject'){
        const partial={date:document.getElementById('date')?.value||state.link.date,period:document.getElementById('period')?.value||state.link.period,grade:document.getElementById('grade')?.value||state.link.grade,subject:document.getElementById('subject')?.value||state.link.subject};
        state.link={...state.link,...partial};setLinkFromSelection(partial);render();return;
      }
      if(e.target.id==='plan-files'){if(e.target.files?.length)await uploadPlans([...e.target.files]);return}
      if(e.target.id==='activity-file'){
        const files=[...(e.target.files||[])];if(!files.length)return;
        let total=0,failed=[];
        for(const f of files){
          try{
            const parsed=await parseFile(f);
            const text=parsed.rawText||parsed.rows.map(r=>r.cells.join('\t')).join('\n');
            const rows=parseActivityLines(text,{grade:state.link.grade,subject:state.link.subject});
            if(!rows.length)throw new Error('활동 표를 읽지 못했습니다.');
            state.activities.push(...rows);total+=rows.length;
          }catch(err){failed.push(`${f.name}: ${err.message}`)}
        }
        await dbSet('activities',state.activities);
        state.notice=failed.length?`${total}개 활동 추가 · 실패 ${failed.length}개: ${failed.join(' / ')}`:`${files.length}개 파일에서 ${total}개 활동을 추가했습니다.`;
        render();return;
      }
      const aiEd=e.target.closest('[data-ai-edit]');if(aiEd){const idx=Number(aiEd.dataset.index);if(state.activityAiPreview[idx]){state.activityAiPreview[idx][aiEd.dataset.aiEdit]=aiEd.value.trim();if(aiEd.dataset.aiEdit==='group'&&!aiEd.value.trim())state.activityAiPreview[idx].group='기본 활동';}};
      const ed=e.target.closest('[data-edit]');if(ed){const a=state.activities.find(x=>x.id===ed.dataset.id);if(a){a[ed.dataset.edit]=ed.value.trim();await dbSet('activities',state.activities);state.notice='활동 정보를 저장했습니다.';}}
      const pe=e.target.closest('[data-plan-edit]');if(pe){const p=state.plans.find(x=>x.id===pe.dataset.id);if(p){p[pe.dataset.planEdit]=pe.value;await dbSet('plans',state.plans);state.notice='계획서 기본 정보를 저장했습니다.';render();}}
    };
    app.oninput=e=>{if(e.target.id==='activity')state.link.activity=e.target.value;if(e.target.id==='linkage-edit'&&state.result)state.result.linkage=e.target.value;};
  }

  init();
</script>
</body>
