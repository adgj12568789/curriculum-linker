    .activity-toolbar{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}.bulk{min-height:180px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.hint{font-size:12px;color:#777d79;padding:10px 12px;border-radius:14px;background:#f5f4ef}.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:17px}.data-table{width:100%;border-collapse:collapse;min-width:840px}.data-table th{background:#f1f0e9;color:#717671;font-size:11px;text-align:left;padding:10px}.data-table td{border-top:1px solid #eeeeea;padding:9px;background:#fff}.data-table input,.data-table select{width:100%;border:1px solid #e1e1da;border-radius:12px;padding:9px;background:#fbfbf8;outline:none;font-size:12px}.activity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.activity-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px}.activity-card-top{display:flex;justify-content:space-between;align-items:center}.activity-title{font-size:15px;font-weight:900;margin:12px 0 7px}.activity-content{font-size:13px;color:#707672;min-height:44px}.group-pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f0efe9;color:#5d625f;font-size:11px;font-weight:900}
    .records-list{display:flex;flex-direction:column;gap:12px}.record-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px}.record-top{display:flex;gap:7px;flex-wrap:wrap}.record-card h3{font-size:15px;margin:12px 0 6px}.record-card p{font-size:14px;line-height:1.72;margin:0 0 12px}.record-standard{padding:11px;border-radius:14px;background:#f7f6f1;color:#666d69;font-size:12px}.record-actions{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-top:13px}

    .ai-box{padding:16px;border:1px solid var(--line);border-radius:20px;background:#fbfbf8}.ai-box h3{font-size:14px;margin:0 0 5px}.ai-box p{font-size:12px;color:#777d79;margin:0 0 12px}.ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ai-status{font-size:11px;color:#6e7470;margin-top:8px}.schedule-table{min-width:760px}.schedule-table td,.schedule-table th{white-space:nowrap}.schedule-note{font-size:11px;color:#818783;margin-top:7px}.activity-list-box{display:flex;flex-direction:column;gap:8px;margin-top:10px}.activity-time-card{padding:12px;border:1px solid #dedfd8;border-radius:16px;background:#fff}.activity-time-card.primary-match{border-color:#747a74;box-shadow:0 0 0 2px rgba(38,43,39,.05)}.activity-time-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.activity-time-content{font-size:13px;font-weight:760;margin-top:5px}.activity-time-sub{font-size:11px;color:#838985;margin-top:3px}.draft-table{min-width:980px}.draft-table textarea{width:100%;min-height:56px;border:1px solid #e1e1da;border-radius:12px;padding:8px;background:#fbfbf8;resize:vertical;font-size:12px}.draft-table input,.draft-table select{min-width:80px}.primary-alt{background:#4f5b51}.pill-soft{background:#f3f2ec;border:1px solid #dedfd8;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;color:#5d635f}
    .lunch-chip{margin-top:10px;display:inline-flex;padding:8px 11px;border-radius:999px;background:#f3efe3;border:1px solid #e3ddcc;color:#615943;font-size:12px;font-weight:850}.empty{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#8a8f8c}.empty h3{margin:12px 0 5px;color:#3f4541}.empty p{margin:0;max-width:360px;font-size:13px}.footer{text-align:center;color:#969b98;font-size:11px;padding:26px}.hidden{display:none!important}.danger-text{color:var(--danger)}
    @media(max-width:960px){.grid-two{grid-template-columns:1fr}.activity-grid{grid-template-columns:1fr 1fr}.file-controls{grid-template-columns:1fr 1fr}.hero-card{align-items:flex-start;flex-direction:column}}
    @media(max-width:650px){.topbar{padding:0 16px}.main-tabs{padding-left:16px;padding-right:16px}.content{padding:18px 14px 80px}.field-grid,.output-columns,.activity-grid,.activity-toolbar,.upload-zone{grid-template-columns:1fr}.file-controls{grid-template-columns:1fr}.full{grid-column:auto}.brand-sub{display:none}}

<body>
<div id="app" class="app"></div>
<script type="module">
  const DB='curriculum-linker-v2', STORE='data';
  const state={
    tab:'link',
    planFilter:'all',
    activityFilter:'all',
    recordFilter:'all',
    plans:[],
    activities:[],
    periodSchedule:{
      '1':{start:'09:00',end:'09:45'},'2':{start:'09:55',end:'10:40'},'3':{start:'10:50',end:'11:35'},
      '4':{start:'11:45',end:'12:30'},'5':{start:'13:15',end:'14:00'},'6':{start:'14:10',end:'14:55'},'7':{start:'15:05',end:'15:50'}
    },
    lunchSchedule:{start:'12:30',end:'13:15'},
    records:[],
    activityDraft:[],
    activitySource:'',
    activityDraftSource:'',
    link:{date:'2026-10-06',period:'1',grade:'1',subject:'사회',activity:'',activityId:'',planRowId:'',activityGroup:'',activitySummary:''},
    result:null,
    notice:'',
    busy:false
  };
  let pdfjsLib=null;
  try{ pdfjsLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs'); pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs'; }catch(e){ pdfjsLib=null; }

  const icons={spark:'✦',upload:'↑',book:'▣',clock:'◷',record:'☷',search:'⌕',trash:'×',plus:'＋',file:'▤',edit:'✎'};
  const dayNames=['일','월','화','수','목','금','토'];
  const subjects=['사회','역사','통합사회','도덕','국어','영어','수학','과학','기술·가정','정보','체육','미술','음악','기타'];
  const grades=['공통','1','2','3'];
  const clean=s=>String(s??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const now=()=>new Date().toISOString();
  const makeId=(p='id')=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);

  function weekLabel(iso){
    const d=new Date(iso+'T00:00:00');
    if(Number.isNaN(d.getTime())) return '';
    const first=new Date(d.getFullYear(),d.getMonth(),1);
    const mondayIndex=(first.getDay()+6)%7;
    const week=Math.floor((d.getDate()+mondayIndex-1)/7)+1;
    return `${d.getMonth()+1}월 ${week}주차`;
  }
  const DATE_RE=/(?:\d{4}\s*[./-]\s*)?(\d{1,2})\s*(?:월|[./-])\s*(\d{1,2})\s*(?:일)?(?:\s*[~～-]\s*(?:(\d{1,2})\s*(?:월|[./-])\s*)?(\d{1,2})\s*(?:일)?)?/;
  // '9월 5주~10월 1주' 같은 범위는 두 주차 모두 검색 대상이 됩니다.
  const WEEK_GLOBAL_RE=/(\d{1,2})\s*월\s*(\d{1,2})\s*주(?:차)?|(?<!\d)(\d{1,2})\s*주(?:차)?/g;
  const WEEK_RE=/(\d{1,2})\s*월\s*(\d{1,2})\s*주(?:차)?|(\d{1,2})\s*주(?:차)?/;
  const CODE_RE=/\[[^\]]{2,50}-\d{1,3}\]|\b\d{1,2}[가-힣A-Za-z()·\-]{0,18}-\d{1,3}\b/;

  function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function dbGet(k){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function dbSet(k,v){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
  async function dbDel(k){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

  function inferGrade(text){const m=String(text).match(/(?:중학교\s*)?([1-3])\s*학년/);return m?m[1]:''}
  function inferSubject(text){const s=subjects.find(x=>String(text).includes(x));return s||''}
  function weekFromDateText(t){const m=String(t).match(DATE_RE);if(!m)return '';const y=new Date().getFullYear();return weekLabel(`${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]||m[1]).padStart(2,'0')}`)}
  function extractWeeks(s){
    const found=[]; const seen=new Set(); const str=String(s||'');
    WEEK_GLOBAL_RE.lastIndex=0;
    let m;
    while((m=WEEK_GLOBAL_RE.exec(str))){
      const label=m[1]?`${m[1]}월 ${m[2]}주차`:`${m[3]}주차`;
      if(!seen.has(label)){seen.add(label);found.push(label);}
    }
    WEEK_GLOBAL_RE.lastIndex=0;
    return found;
  }
  function extractWeek(s){return extractWeeks(s)[0]||'';}
  function normalizeWeekLabel(w){
    const m=String(w||'').match(WEEK_RE);
    return m ? (m[1]?`${m[1]}월 ${m[2]}주차`:`${m[3]}주차`) : clean(w);
  }
  function findTopic(s){
    const candidates=String(s||'').split('|').map(clean).filter(Boolean);
    const picked=candidates.filter(x=>/^(?:[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩXIVLCM]+\s*[.)]|\d{1,2}\s*[.)])/.test(x));
    return picked.slice(0,2).join(' / ');
  }

  function findCell(cells,re){return cells.find(x=>re.test(String(x)))||''}
  function normalizeRows(rows,fileName){
    const matrix=rows.map(r=>r.cells.map(clean));
    let headerIndex=-1;
    for(let i=0;i<Math.min(matrix.length,120);i++){
      const joined=matrix[i].join(' ');
      if(/성취기준|주차|기간|날짜/.test(joined) && (CODE_RE.test(joined)||/성취기준/.test(joined))){headerIndex=i;break}
    }
    const header=headerIndex>=0?matrix[headerIndex]:[];
    const idx={
      week:header.findIndex(x=>/주차|주|기간/.test(x)),
      date:header.findIndex(x=>/날짜|기간/.test(x)),
      code:header.findIndex(x=>/성취기준 ?코드|코드/.test(x)),
      standard:header.findIndex(x=>/성취기준/.test(x)&&!/코드/.test(x)),
      content:header.findIndex(x=>/교과 ?내용|학습 ?내용|단원|소단원/.test(x)),
      subject:header.findIndex(x=>/과목|교과/.test(x)),
      grade:header.findIndex(x=>/학년/.test(x))
    };
    const out=[]; const carry={week:'',dateText:'',code:'',standard:'',topic:'',subject:'',grade:''};
    const start=Math.max(0,headerIndex+1);

    for(let i=start;i<matrix.length;i++){
      const c=matrix[i]; if(!c.some(Boolean))continue;
      const rowText=c.join(' | ');
      const rawWeek=clean(idx.week>=0?c[idx.week]:findCell(c,WEEK_RE));
      const rowWeeks=extractWeeks(rawWeek||rowText);
      const dateText=clean(idx.date>=0?c[idx.date]:findCell(c,DATE_RE)) || carry.dateText;
      const code=clean(idx.code>=0?c[idx.code]:findCell(c,CODE_RE));
      const standardCell=clean(idx.standard>=0?c[idx.standard]:'');
      const topicCell=clean(idx.content>=0?c[idx.content]:'') || findTopic(rowText);
      const subject=clean(idx.subject>=0?c[idx.subject]:'') || inferSubject(rowText) || carry.subject || inferSubject(fileName);
      const grade=clean(idx.grade>=0?c[idx.grade]:'') || inferGrade(rowText) || carry.grade || inferGrade(fileName);

      if(code) carry.code=code;
      if(standardCell) carry.standard=standardCell;
      if(topicCell && !/^(?:[-‣☞]|평가|관찰|동료|자기|형성|보고서|퀴즈|프로젝트)/.test(topicCell)) carry.topic=topicCell;
      if(dateText) carry.dateText=dateText;
      if(subject) carry.subject=subject;
      if(grade) carry.grade=grade.match(/[1-3]/)?.[0]||grade;

      const effectiveWeeks=rowWeeks.length?rowWeeks:(carry.week?[carry.week]:(dateText?[weekFromDateText(dateText)]:[]));
      if(effectiveWeeks.length) carry.week=effectiveWeeks[effectiveWeeks.length-1];

      const effectiveCode=code||carry.code;
      const effectiveStandard=standardCell||carry.standard;
      const isBadTopic=/^(?:[-‣☞]|평가|관찰|동료|자기|형성|보고서|퀴즈|프로젝트)/.test(topicCell);
      const effectiveTopic=!isBadTopic && topicCell ? topicCell : (carry.topic||'');
      const effectiveContent=effectiveTopic || c.filter(Boolean).filter(x=>x!==standardCell&&x!==code).join(' | ');

      if(effectiveWeeks.length && (effectiveCode||effectiveStandard||effectiveTopic||dateText)){
        effectiveWeeks.forEach(w=>out.push({
          id:makeId('row'),
          week:normalizeWeekLabel(w),
          dateText,
          code:effectiveCode,
          standard:effectiveStandard,
          content:effectiveTopic||effectiveContent,
          topic:effectiveTopic,
          subject:subject.match(/사회|역사|통합사회|도덕|국어|영어|수학|과학|기술·가정|정보|체육|미술|음악|기타/)?.[0]||subject,
          grade:(grade.match(/[1-3]/)?.[0]||grade),
          source:rowText
        }));
      }
    }
    return dedupe(out);
  }

  function normalizeText(text,fileName){
    const raw=String(text||'').replace(/\r/g,' ');
    // 페이지 전체가 한 줄로 저장된 구버전 PDF도 주차를 기준으로 다시 나눕니다.
    const marked=raw
      .replace(/(\d{1,2}\s*월\s*\d{1,2}\s*주(?:차)?\s*(?:(?:~|～|-|−)\s*(?:(?:\d{1,2}\s*월\s*)?\d{1,2}\s*주(?:차)?))?)/g,'\n$1\n')
      .replace(/((?:\[[^\]]{2,50}-\d{1,3}\]))/g,'\n$1 ');
    const lines=marked.split(/\n+/).map(clean).filter(Boolean);
    const out=[]; const context={code:'',standard:'',topic:'',subject:inferSubject(fileName),grade:inferGrade(fileName)};
    let current=null;

    function newCurrent(weeks=[]){
      return {
        weeks,
        dateText:'',
        code:context.code||'',
        standard:context.standard||'',
        topic:context.topic||'',
        content:'',
        subject:context.subject||inferSubject(fileName)||'',
        grade:context.grade||inferGrade(fileName)||'',
        mode:'idle'
      };
    }
    function finalize(){
      if(!current)return;
      const weeks=(current.weeks||[]).filter(Boolean);
      if(!weeks.length)return;
      const code=current.code||context.code||'';
      const standard=clean(current.standard||context.standard||'');
      const topic=clean(current.topic||context.topic||'');
      const content=topic||clean(current.content||'');
      if(!(code||standard||topic||content))return;
      weeks.forEach(w=>out.push({
        id:makeId('row'),
        week:normalizeWeekLabel(w),
        dateText:current.dateText||'',
        code,
        standard,
        content,
        topic,
        subject:current.subject||context.subject||inferSubject(fileName)||'',
        grade:current.grade||context.grade||inferGrade(fileName)||'',
        source:[code,standard,topic,current.content].filter(Boolean).join(' | ')
      }));
    }

    for(const line of lines){
      const weeks=extractWeeks(line);
      const codeMatch=line.match(CODE_RE);
      const grade=inferGrade(line), subject=inferSubject(line);
      const topic=findTopic(line);
      const date=line.match(DATE_RE)?.[0]||'';

      if(weeks.length){
        if(current)finalize();
        current=newCurrent(weeks);
        if(date)current.dateText=date;
        if(grade){current.grade=grade.match(/[1-3]/)?.[0]||grade;context.grade=current.grade;}
        if(subject){current.subject=subject;context.subject=subject;}
        if(topic){current.topic=topic;context.topic=topic;}
        if(codeMatch){
          current.code=codeMatch[0]; context.code=current.code;
          const rest=clean(line.replace(codeMatch[0],''));
          if(rest){current.standard=rest;current.mode='standard';}
        }
        if(/‣/.test(line)) current.mode='activity';
        continue;
      }

      if(!current) current=newCurrent([]);
      if(grade){current.grade=grade.match(/[1-3]/)?.[0]||grade;context.grade=current.grade;}
      if(subject){current.subject=subject;context.subject=subject;}
      if(date)current.dateText=date;

      if(codeMatch){
        if(current.code && current.code!==codeMatch[0] && current.weeks?.length) finalize();
        current=newCurrent(current.weeks||[]);
        current.code=codeMatch[0]; context.code=current.code;
        const rest=clean(line.replace(codeMatch[0],''));
        current.standard=rest; current.mode='standard';
        continue;
      }

      if(topic){
        current.topic=topic; context.topic=topic;
        continue;
      }

      // 성취기준 코드는 표의 병합 셀로 한 번만 표시되고 다음 주에는 공란일 수 있으므로,
      // 새 주차가 시작되기 전까지 현재 code/standard를 그대로 상속합니다.
      if(current.mode==='standard' && (current.code||context.code)){
        if(/^‣|^▶|^▪|^▸/.test(line)){
          current.mode='activity';
        }else if(!/^☞/.test(line) && !/^(?:관찰 평가|동료 평가|자기 평가|형성 평가|보고서 평가|서술형 평가|프로젝트|포트폴리오 평가|수업-평가)/.test(line)){
          current.standard=clean(`${current.standard} ${line}`);
          context.standard=current.standard;
          continue;
        }
      }

      if(/^(?:‣|▶|▪|▸)/.test(line)){current.mode='activity';continue;}
      if(/^☞/.test(line) || /^(?:관찰 평가|동료 평가|자기 평가|형성 평가|보고서 평가|서술형 평가|프로젝트|포트폴리오 평가|수업-평가)/.test(line)){current.mode='evaluation';continue;}
      current.content=clean(`${current.content||''} ${line}`);
    }
    finalize();

    // 공란으로 이어지는 병합 셀을 한 번 더 후처리합니다.
    const enriched=[]; let last={...context};
    for(const r of out){
      const code=r.code||last.code;
      const standard=r.standard||last.standard;
      const topic=r.topic||last.topic;
      const grade=r.grade||last.grade;
      const subject=r.subject||last.subject;
      enriched.push({...r,code,standard,topic,content:topic||r.content,grade,subject});
      if(code)last.code=code;
      if(standard)last.standard=standard;
      if(topic)last.topic=topic;
      if(grade)last.grade=grade;
      if(subject)last.subject=subject;
    }
    return dedupe(enriched);
  }

  function dedupe(rows){const seen=new Set();return rows.filter(r=>{const k=[r.week,r.code,r.standard,r.content].join('|');if(seen.has(k))return false;seen.add(k);return true})}

  async function parseFile(file){
    const ext=file.name.split('.').pop().toLowerCase();
    if(['xlsx','xls','csv'].includes(ext)){
      if(!window.XLSX) throw new Error('표 파일 읽기 기능을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
      const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const rows=[];let raw='';
      for(const s of wb.SheetNames){const matrix=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,defval:''});matrix.forEach(c=>rows.push({sheet:s,cells:c.map(v=>String(v??'').trim())}));raw+=`\n[${s}]\n`+matrix.map(c=>c.map(v=>String(v??'').trim()).join(' | ')).join('\n');}
      return {rows,rawText:raw};
    }
    if(ext==='docx'){
      if(!window.mammoth) throw new Error('DOCX 읽기 기능을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
      const out=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return {rows:[],rawText:out.value};
    }
    if(ext==='pdf'){
      if(!pdfjsLib) throw new Error('PDF 읽기 모듈을 불러오지 못했습니다. 가능하면 XLSX/DOCX 파일을 사용해 주세요.');
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
      let raw='';
      for(let p=1;p<=pdf.numPages;p++){
        const page=await pdf.getPage(p);
        const txt=await page.getTextContent();
        const items=txt.items.filter(i=>clean(i.str)).map(i=>({
          text:clean(i.str),
          x:Number(i.transform?.[4]||0),
          y:Number(i.transform?.[5]||0)
        })).sort((a,b)=>Math.abs(b.y-a.y)>2?(b.y-a.y):(a.x-b.x));
        const lines=[];
        for(const item of items){
          let row=lines.find(r=>Math.abs(r.y-item.y)<=3.2);
          if(!row){row={y:item.y,parts:[]};lines.push(row);}
          row.parts.push(item);
        }
        const pageLines=lines.sort((a,b)=>b.y-a.y)
          .map(r=>r.parts.sort((a,b)=>a.x-b.x).map(x=>x.text).join(' | '))
          .filter(Boolean);
        raw+=`\n【${p}쪽】\n`+pageLines.join('\n');
      }
      return {rows:[],rawText:raw};
    }
    return {rows:[],rawText:await file.text()};
  }

  function normalizeParsed(parsed,fileName){return parsed.rows?.length?normalizeRows(parsed.rows,fileName):normalizeText(parsed.rawText||'',fileName)}
  function saveAll(){return Promise.all([dbSet('plans',state.plans),dbSet('activities',state.activities),dbSet('records',state.records)])}

  async function init(){
    try{
      const [oldPlan,plans,activities,periodSchedule,records]=await Promise.all([
        dbGet('plan'),dbGet('plans'),dbGet('activities'),dbGet('periodSchedule'),dbGet('records')
      ]);
      state.plans=Array.isArray(plans)?plans:[];
      let repaired=false;
      state.plans=state.plans.map(p=>{
        if(p.parserVersion===6 || !p.rawPreview) return p;
        try{
          const repairedRows=normalizeText(p.rawPreview,p.fileName||'');
          const oldUseful=(p.rows||[]).filter(r=>r.code||r.standard).length;
          const newUseful=repairedRows.filter(r=>r.code||r.standard).length;
          if(newUseful>oldUseful){
            repaired=true;
            return {...p,rows:repairedRows,parserVersion:6};
          }
          return {...p,parserVersion:6};
        }catch(_){return {...p,parserVersion:6};}
      });
      if(repaired) await dbSet('plans',state.plans);
      if(!state.plans.length&&oldPlan){
        state.plans=[{id:makeId('plan'),fileName:oldPlan.fileName||'기존 계획서',uploadedAt:oldPlan.uploadedAt||now(),defaultGrade:inferGrade(oldPlan.fileName||''),defaultSubject:inferSubject(oldPlan.fileName||''),parserVersion:6,rows:(oldPlan.rows||[]).map(r=>({...r,id:r.id||makeId('row')})),rawPreview:oldPlan.rawPreview||''}];
        await dbSet('plans',state.plans);
      }
      state.periodSchedule={...state.periodSchedule,...(periodSchedule||{})};
      state.activities=Array.isArray(activities)?activities:[];
      // 이전 버전의 샘플 데이터만 제거하고 사용자가 만든 데이터는 보존합니다.
      const oldSamples=[
        '자료를 읽고 핵심 개념을 정리하는 활동','모둠별로 자료를 비교하고 발표하는 활동','역사 자료를 조사하고 사건의 영향을 설명하는 활동'
      ];
      state.activities=state.activities.filter(a=>!oldSamples.includes(a.content));
      // 구버전 활동(요일·교시만 있는 형식)은 보존하되 시간대 기반 구조로 연결할 수 있도록 표시합니다.
      state.activities=state.activities.map(a=>{
        const legacyRange=(!a.start&&a.period)?periodRange(a.period):{start:'',end:''};
        return {
          id:a.id||makeId('a'),date:a.date||'',day:a.day||'',start:a.start||legacyRange.start||'',end:a.end||legacyRange.end||'',duration:a.duration||'',content:a.content||'',group:a.group||'기본 활동'
        };
      });
      state.records=Array.isArray(records)?records:[];
      if(state.records.length){state.records=state.records.map(r=>({...r,activitySummary:r.activitySummary||r.activity||''}));}
      await dbSet('periodSchedule',state.periodSchedule);
      await dbSet('activities',state.activities);
    }catch(e){state.notice='저장된 정보를 불러오지 못했습니다. 브라우저 저장공간을 확인해 주세요.';}
    render();
  }

  function filteredPlans(){
    return state.plans.filter(p=>state.planFilter==='all'||p.defaultGrade===state.planFilter||p.rows.some(r=>r.grade===state.planFilter));
  }
  function findMatches(date,subject,grade){
    if(!date)return [];
    const week=weekLabel(date); const out=[];
    for(const p of state.plans){
      const planGradeOk=p.defaultGrade===''||p.defaultGrade==='공통'||p.defaultGrade===grade||p.rows.some(r=>r.grade===grade);
      const planSubjectOk=!p.defaultSubject||p.defaultSubject==='기타'||p.defaultSubject===subject||p.rows.some(r=>!r.subject||r.subject===subject||r.subject.includes(subject)||subject.includes(r.subject));
      if(!planGradeOk||!planSubjectOk)continue;
      for(const r of p.rows){
        const rowGrade=!r.grade||r.grade===grade;
        const rowSubject=!r.subject||r.subject===subject||r.subject.includes(subject)||subject.includes(r.subject);
        const rowWeeks=Array.isArray(r.weeks)?r.weeks:[r.week];
        const rowWeek=rowWeeks.includes(week);
        if(rowWeek&&rowGrade&&rowSubject) out.push({...r,planId:p.id,planName:p.fileName});
      }
    }
    return out.sort((a,b)=>((a.grade?0:1)-(b.grade?0:1))+((a.subject?0:1)-(b.subject?0:1)));
  }
  function getSelectedMatch(){const matches=findMatches(state.link.date,state.link.subject,state.link.grade);return matches.find(x=>x.id===state.link.planRowId)||matches[0]||null}
  function hm(t){if(!t)return null;const m=String(t).match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):null}
  function periodRange(period){return state.periodSchedule[String(period)]||{start:'',end:''}}
  function activityMatches(){
    const date=state.link.date; const period=periodRange(state.link.period); const ps=hm(period.start),pe=hm(period.end);
    const day=date?dayNames[new Date(date+'T00:00:00').getDay()]:'';
    if(ps===null||pe===null)return [];
    return state.activities.filter(a=>{
      const dateOk=a.date?a.date===date:(!a.day||a.day===day);
      const as=hm(a.start), ae=hm(a.end);
      if(!dateOk||as===null)return false;
      const end=ae===null?24*60:ae;
      return as<pe && end>ps;
    }).map(a=>{
      const as=hm(a.start),ae=hm(a.end)===null?24*60:hm(a.end); const overlap=Math.max(0,Math.min(pe,ae)-Math.max(ps,as));
      const utility=(/이동|식사|조식|중식|석식|숙소/.test(a.content)?-20:25);
      return {...a,overlap,score:overlap+utility};
    }).sort((a,b)=>b.score-a.score || (hm(a.start)||0)-(hm(b.start)||0));
  }
  function selectedActivitySummary(matches){return matches.map(a=>`${a.start}~${a.end||''} ${a.content}`).join(' → ')}
  function stripPlanNoise(value){
    return String(value||'')
      .replace(/\b\d+\s*\/\s*\d+\b/g,'')
      .replace(/시수\s*\/\s*누계/g,'')
      .replace(/【[^】]*】/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }
  function firstConcept(r){
    const standard=stripPlanNoise(r.standard||'');
    const topic=stripPlanNoise(r.content||r.topic||'');
    if(topic && !/^\d+\s*\//.test(topic)) return topic;
    const cleaned=standard.replace(/^\[[^\]]+\]\s*/,'');
    const parts=cleaned.split(/[,.。]/).map(x=>x.trim()).filter(Boolean);
    return parts[0]||'해당 교과의 핵심 개념';
  }
  function fallback(r,activity){
    const a=stripPlanNoise(activity)||'해당 활동';

  }

  function parseActivityLines(text){
    const lines=String(text||'').replace(/\\~/g,'~').split(/\r?\n/).map(x=>x.trim()).filter(Boolean)
      .map(x=>x.replace(/^\|+|\|+$/g,'').trim()).filter(x=>!/^[-|\s]+$/.test(x));
    const currentYear=new Date().getFullYear(); let date=''; let day=''; let pending=null; const out=[];
    const dateRe=/^\*\*?\s*(\d{1,2})\.\s*(\d{1,2})\.?\s*\(?([월화수목금])(?:요일)?\)?\s*\**$/;
    const timeRe=/(\d{1,2}:\d{2})\s*[~～-]\s*(\d{1,2}:\d{2})?\s*(?:\((\d+)\))?/;
    const push=()=>{if(!pending)return; const a={...pending,id:pending.id||makeId('a'),date,day,group:pending.group||inferGroup(pending.content)};if(a.content)out.push(a);pending=null;};
    for(let line of lines){
      line=line.replace(/^\*+|\*+$/g,'').trim().replace(/^\|\s*|\s*\|$/g,'');
      const dm=line.match(dateRe); if(dm){push();date=`${currentYear}-${String(dm[1]).padStart(2,'0')}-${String(dm[2]).padStart(2,'0')}`;day=dm[3];continue;}
      const tm=line.match(timeRe); if(tm){push();pending={id:makeId('a'),start:tm[1],end:tm[2]||'',duration:tm[3]||'',content:''};continue;}
      if(!pending)continue;
      pending.content=(pending.content?pending.content+' ':'')+line;
    }
    push();
    return out.map(a=>({...a,group:a.group||inferGroup(a.content)}));
  }

  async function uploadPlans(files){
    if(!files.length)return; state.busy=true; state.notice=`${files.length}개 파일을 읽는 중입니다…`; render();
    let ok=0;const failed=[];
    for(const file of files){
      try{
        const parsed=await parseFile(file);const rows=normalizeParsed(parsed,file.name);if(!rows.length)throw new Error('주차·성취기준 정보를 찾지 못했습니다.');
        const plan={id:makeId('plan'),parserVersion:6,fileName:file.name,uploadedAt:now(),defaultGrade:inferGrade(file.name),defaultSubject:inferSubject(file.name),rows,rawPreview:(parsed.rawText||'').slice(0,80000),showPreview:false};
        state.plans.push(plan);ok++;
      }catch(e){failed.push(`${file.name}: ${e.message}`)}
    }
    await dbSet('plans',state.plans); state.busy=false; state.notice=failed.length?`${ok}개 저장 완료 · 실패 ${failed.length}개: ${failed.join(' / ')}`:`${ok}개 계획서를 저장했습니다. 기존 계획서는 그대로 유지됩니다.`;render();
  }

  async function organizeActivities(){
    const raw=document.getElementById('bulk')?.value||''; state.activitySource=raw;
    if(!raw.trim()){state.notice='일정표 내용을 먼저 붙여 넣어 주세요.';render();return}
    state.busy=true;state.notice='AI가 일자·시간·세부 일정을 정리하고 있습니다…';render();

  async function generate(){
    const m=getSelectedMatch(); if(!m){state.notice='선택한 날짜·학년·과목의 계획서 항목이 없습니다.';render();return}
    const activity=String(state.link.activity||'').trim();if(!activity){state.notice='활동 내용을 입력하거나 등록된 활동을 선택해 주세요.';render();return}
    state.notice='교과 내용과 활동을 연결하고 있습니다…';render();
    try{
      const resp=await fetch('/api/generate-linkage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:state.link.grade,subject:state.link.subject,date:state.link.date,week:m.week,code:m.code,standard:stripPlanNoise(m.standard),content:stripPlanNoise(m.content||m.topic),activity:stripPlanNoise(activity)})});
      const data=resp.ok?await resp.json():{};
      state.result={...m,grade:state.link.grade,subject:state.link.subject,activity,activitySummary:state.link.activitySummary||activity,activityGroup:state.link.activityGroup||'기본 활동',linkage:data.linkage||fallback(m,activity),generatedAt:now(),id:makeId('r'),source:data.source||'fallback'};
      state.notice=data.source==='gemini'?'Gemini로 작성했습니다. 필요하면 문구를 직접 수정한 뒤 기록으로 저장할 수 있습니다.':'기본 연계 문구로 작성했습니다. Vercel의 GEMINI_API_KEY를 확인해 주세요.';
    }catch(e){state.result={...m,grade:state.link.grade,subject:state.link.subject,activity,activitySummary:state.link.activitySummary||activity,activityGroup:state.link.activityGroup||'기본 활동',linkage:fallback(m,activity),generatedAt:now(),id:makeId('r'),source:'fallback'};state.notice='AI 연결에 실패하여 기본 연계 문구를 표시했습니다.';}
    render();
  }

  async function saveResult(){
    if(!state.result)return;state.result.activitySummary=state.result.activitySummary||state.result.activity;const edited=document.getElementById('linkage-edit')?.value?.trim();if(edited)state.result.linkage=edited;const existing=state.records.findIndex(r=>r.id===state.result.id);if(existing>=0)state.records[existing]=state.result;else state.records.unshift(state.result);await dbSet('records',state.records);state.notice='활동 기록에 저장했습니다.';state.tab='records';render();
  }

  function setLinkFromSelection(partial){
    state.link={...state.link,...partial};
    const matches=activityMatches();
    if(!partial.activityId){const first=matches[0];state.link.activityId=first?.id||'';state.link.activity=first?.content||'';state.link.activityGroup=first?.group||'기본 활동';state.link.activitySummary=selectedActivitySummary(matches);}
    const pm=findMatches(state.link.date,state.link.subject,state.link.grade);state.link.planRowId=pm[0]?.id||'';
  }

  function wire(){
    const app=document.getElementById('app');
    app.onclick=async e=>{
      const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;state.notice='';render();return}
      const af=e.target.closest('[data-activity-filter]');if(af){state.activityFilter=af.dataset.activityFilter;render();return}
      const pf=e.target.closest('[data-plan-filter]');if(pf){state.planFilter=pf.dataset.planFilter;render();return}
      const rf=e.target.closest('[data-record-filter]');if(rf){state.recordFilter=rf.dataset.recordFilter;render();return}
      const pa=e.target.closest('[data-pick-activity]');if(pa){const a=state.activities.find(x=>x.id===pa.dataset.pickActivity);if(a){state.link.activityId=a.id;state.link.activity=a.content;state.link.activityGroup=a.group||'기본 활동';state.link.activitySummary=selectedActivitySummary(activityMatches());render();}return}
      const pp=e.target.closest('[data-pick-plan]');if(pp){state.link.planRowId=pp.dataset.pickPlan;render();return}
      const btn=e.target.closest('#generate');if(btn){await generate();return}
      if(e.target.closest('#save-record')||e.target.closest('#save-record-alt')){await saveResult();return}
      if(e.target.closest('#apply-linkage-edit')){if(state.result){state.result.linkage=document.getElementById('linkage-edit').value.trim();state.notice='수정한 교과연계 문구를 반영했습니다.';render();}return}
      if(e.target.closest('#choose-plan-files')){document.getElementById('plan-files')?.click();return}
      if(e.target.closest('#choose-activity-file')){document.getElementById('activity-file')?.click();return}
      if(e.target.closest('#ai-organize')){await organizeActivities();return}
      if(e.target.closest('#save-draft')){await saveActivityDraft(false);return}
      if(e.target.closest('#replace-draft')){await saveActivityDraft(true);return}
      if(e.target.closest('#clear-bulk')){state.activitySource='';state.activityDraft=[];render();return}
      const delp=e.target.closest('[data-delete-plan]');if(delp){if(confirm('이 계획서 파일을 삭제할까요? 다른 파일과 기록에는 영향을 주지 않습니다.')){state.plans=state.plans.filter(p=>p.id!==delp.dataset.deletePlan);await dbSet('plans',state.plans);state.notice='계획서를 삭제했습니다.';render();}return}
      const tp=e.target.closest('[data-toggle-preview]');if(tp){const p=state.plans.find(x=>x.id===tp.dataset.togglePreview);if(p){p.showPreview=!p.showPreview;await dbSet('plans',state.plans);render();}return}
      const da=e.target.closest('[data-delete-activity]');if(da){state.activities=state.activities.filter(a=>a.id!==da.dataset.deleteActivity);await dbSet('activities',state.activities);state.notice='활동을 삭제했습니다.';render();return}
      const dr=e.target.closest('[data-delete-record]');if(dr){state.records=state.records.filter(r=>r.id!==dr.dataset.deleteRecord);await dbSet('records',state.records);state.notice='기록을 삭제했습니다.';render();return}
    };
    app.onchange=async e=>{
      if(e.target.id==='date'||e.target.id==='period'||e.target.id==='grade'||e.target.id==='subject'){
        const partial={date:document.getElementById('date')?.value||state.link.date,period:document.getElementById('period')?.value||state.link.period,grade:document.getElementById('grade')?.value||state.link.grade,subject:document.getElementById('subject')?.value||state.link.subject};
        state.link={...state.link,...partial};setLinkFromSelection(partial);render();return;
      }
      if(e.target.id==='plan-files'){if(e.target.files?.length)await uploadPlans([...e.target.files]);return}
      if(e.target.id==='activity-file'){
        const f=e.target.files?.[0];if(!f)return;try{const parsed=await parseFile(f);const text=parsed.rawText||parsed.rows.map(r=>r.cells.join('\t')).join('\n');state.activitySource=text;const resp=await fetch('/api/organize-activities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,year:new Date().getFullYear()})});const data=resp.ok?await resp.json():{};const rows=(data.activities||parseActivityLines(text)).map(a=>({...a,id:a.id||makeId('draft')}));state.activityDraft=rows;state.activityDraftSource=data.source==='gemini'?'Gemini':'규칙 기반 보완';state.notice=`${rows.length}개 일정으로 정리했습니다. 결과를 확인한 뒤 저장해 주세요.`;render();}catch(err){state.notice='활동 파일 가져오기 실패 · '+err.message;render();}return;
      }
      const pt=e.target.closest('[data-period-time]');if(pt){const n=pt.dataset.period,s=state.periodSchedule[n]||{start:'',end:''};s[pt.dataset.periodTime]=pt.value;state.periodSchedule[n]=s;await dbSet('periodSchedule',state.periodSchedule);state.notice=`${n}교시 시간대를 저장했습니다.`;render();return;}
      const ed=e.target.closest('[data-edit]');if(ed){const a=state.activities.find(x=>x.id===ed.dataset.id);if(a){a[ed.dataset.edit]=ed.value.trim();if(ed.dataset.edit==='date'&&a.date)a.day=dayNames[new Date(a.date+'T00:00:00').getDay()];await dbSet('activities',state.activities);state.notice='활동 정보를 저장했습니다.';}}
      const de=e.target.closest('[data-draft-edit]');if(de){const a=state.activityDraft.find(x=>x.id===de.dataset.id);if(a){a[de.dataset.draftEdit]=de.value.trim();if(de.dataset.draftEdit==='date'&&a.date)a.day=dayNames[new Date(a.date+'T00:00:00').getDay()];render();return;}}
      const pe=e.target.closest('[data-plan-edit]');if(pe){const p=state.plans.find(x=>x.id===pe.dataset.id);if(p){p[pe.dataset.planEdit]=pe.value;await dbSet('plans',state.plans);state.notice='계획서 기본 정보를 저장했습니다.';render();}}
    };
    app.oninput=e=>{
      if(e.target.id==='activity'){state.link.activity=e.target.value;return;}
      if(e.target.id==='bulk'){state.activitySource=e.target.value;return;}
      if(e.target.id==='linkage-edit'&&state.result)state.result.linkage=e.target.value;
      const de=e.target.closest('[data-draft-edit]');if(de){const a=state.activityDraft.find(x=>x.id===de.dataset.id);if(a){a[de.dataset.draftEdit]=e.target.value;}}
    };
  }

  init();
</script>
</body>
</html>
